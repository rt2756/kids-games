<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Pop the Bubbles</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.25), transparent 50%),
      linear-gradient(180deg, #43cea2 0%, #185a9d 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
  }

  /* A few drifting highlights so the water feels alive */
  .sparkle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    filter: blur(1px);
    pointer-events: none;
    animation: drift 6s ease-in-out infinite;
  }
  @keyframes drift {
    0%,100% { transform: translate(0,0); opacity: 0.6; }
    50%     { transform: translate(20px,-30px); opacity: 1; }
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    transform: translate(-50%, 0);
    will-change: transform, top;
    background:
      radial-gradient(circle at 32% 30%,
        rgba(255,255,255,0.95) 0%,
        rgba(230,245,255,0.55) 18%,
        rgba(170,210,255,0.28) 45%,
        rgba(120,180,255,0.18) 75%,
        rgba(100,160,255,0.12) 100%);
    border: 2px solid rgba(255,255,255,0.55);
    box-shadow:
      inset -8px -10px 18px rgba(80,140,220,0.25),
      inset 6px 6px 14px rgba(255,255,255,0.35),
      0 0 20px rgba(255,255,255,0.3);
    transition: transform 0.08s;
  }
  .bubble::before {
    /* The shiny highlight */
    content: '';
    position: absolute;
    top: 14%;
    left: 18%;
    width: 28%;
    height: 34%;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
  }
  .bubble::after {
    /* Tiny second highlight */
    content: '';
    position: absolute;
    top: 22%;
    left: 60%;
    width: 10%;
    height: 12%;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    pointer-events: none;
  }
  .bubble:active { transform: translate(-50%, 0) scale(0.92); }

  /* Burst droplets */
  .droplet {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(180,220,255,0.6));
    pointer-events: none;
    animation: burst 0.6s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* Friendly screen shake when a bubble reaches the surface unpopped */
  @keyframes friendly-shake {
    0%, 100% { transform: translate(0, 0); }
    15%      { transform: translate(-5px, -3px); }
    30%      { transform: translate(5px, 2px); }
    45%      { transform: translate(-4px, 3px); }
    60%      { transform: translate(4px, -2px); }
    80%      { transform: translate(-2px, 1px); }
  }
  body.shake { animation: friendly-shake 0.4s ease-out; }

  .score {
    position: fixed;
    top: 20px;
    right: 24px;
    background: rgba(255,255,255,0.9);
    padding: 10px 22px;
    border-radius: 40px;
    font-size: 32px;
    font-weight: 900;
    color: #185a9d;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    user-select: none;
  }
</style>
</head>
<body>
  <div class="sparkle" style="top: 15%; left: 15%; animation-delay: 0s;"></div>
  <div class="sparkle" style="top: 40%; right: 20%; animation-delay: 2s;"></div>
  <div class="sparkle" style="top: 70%; left: 60%; animation-delay: 4s;"></div>

  <div id="stage"></div>
  <div class="score">🫧 <span id="count">0</span></div>

  <script src="../../shared/common.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const countEl = document.getElementById('count');
    let popped = 0;

    function spawnBubble() {
      const el = document.createElement('div');
      el.className = 'bubble';

      // Varied bubble sizes so the screen feels lively
      const size = 80 + Math.random() * 100;
      el.style.width  = size + 'px';
      el.style.height = size + 'px';

      const x = size/2 + Math.random() * (window.innerWidth - size);
      el.style.left = x + 'px';
      el.style.top = (window.innerHeight + size) + 'px';

      // Larger bubbles rise slower. Also speed up as the game progresses:
      // every popped bubble shrinks the rise time by 1.5%, capped so bubbles
      // never get impossibly fast for a 3yo (minimum 35% of original time).
      const speedFactor = Math.max(0.35, 1 - popped * 0.015);
      const duration = (3500 + (size * 15) + Math.random() * 1500) * speedFactor;
      const floatAnim = el.animate(
        [
          { top: (window.innerHeight + size) + 'px' },
          { top: (-size - 40) + 'px' }
        ],
        { duration, easing: 'linear', fill: 'forwards' }
      );
      floatAnim.onfinish = () => {
        // Bubble reached the surface without being popped — friendly bump
        if (!el.dataset.popped) triggerBump();
        el.remove();
      };

      // Gentle side-to-side sway
      const sway = 15 + Math.random() * 25;
      el.animate(
        [
          { transform: `translate(-50%, 0) translateX(-${sway}px)` },
          { transform: `translate(-50%, 0) translateX(${sway}px)` },
          { transform: `translate(-50%, 0) translateX(-${sway}px)` }
        ],
        { duration: 2500 + Math.random() * 1500, iterations: Infinity, easing: 'ease-in-out' }
      );

      const pop = (e) => {
        e.stopPropagation();
        if (el.dataset.popped) return;
        el.dataset.popped = '1';
        KidsAudio.playPop();
        popped++;
        countEl.textContent = popped;

        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        burst(cx, cy);
        el.remove();
      };
      el.addEventListener('click', pop);
      el.addEventListener('touchstart', pop, { passive: true });

      stage.appendChild(el);
    }

    // Friendly bump when a bubble sneaks past: a soft screen shake and
    // a low 'bonk' tone. Intentionally mild — we want "oh!" not "ugh!".
    function triggerBump() {
      document.body.classList.remove('shake');
      void document.body.offsetWidth; // restart animation
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 400);

      const ctx = KidsAudio.getAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    function burst(x, y) {
      const n = 12;
      for (let i = 0; i < n; i++) {
        const p = document.createElement('div');
        p.className = 'droplet';
        p.style.left = (x - 7) + 'px';
        p.style.top = (y - 7) + 'px';
        const angle = (Math.PI * 2 * i) / n;
        const dist = 60 + Math.random() * 50;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 650);
      }
    }

    spawnBubble();
    setInterval(spawnBubble, 950);

    // Prime audio on first interaction
    const prime = () => { KidsAudio.getAudio(); document.removeEventListener('pointerdown', prime); };
    document.addEventListener('pointerdown', prime);
  </script>
</body>
</html>
