<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Alphabet Keys</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(135deg, #4568dc 0%, #b06ab3 100%);
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  #display {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .big-letter {
    position: absolute;
    font-size: clamp(180px, 45vw, 420px);
    font-weight: 900;
    font-family: "Arial Black", sans-serif;
    text-shadow:
      6px 6px 0 rgba(0,0,0,0.25),
      -3px -3px 0 rgba(255,255,255,0.4);
    animation: pop-in 0.35s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
    user-select: none;
    line-height: 1;
  }
  @keyframes pop-in {
    0%   { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    60%  { transform: scale(1.15) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .big-letter.fade {
    animation: fade-out 0.4s ease-out forwards;
  }
  @keyframes fade-out {
    to { transform: scale(1.4); opacity: 0; }
  }
  .hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 24px;
    font-weight: 700;
    opacity: 0.85;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    white-space: nowrap;
  }

  /* Onscreen keyboard — docked to the bottom-left so it doesn't
     cover the big letter in the center of the screen. */
  #keyboard {
    position: fixed;
    bottom: 10px;
    left: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: flex-start;
  }
  .row { display: flex; gap: 5px; justify-content: flex-start; }
  .key {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: rgba(255,255,255,0.92);
    color: #333;
    font-size: 22px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.3);
    user-select: none;
    transition: transform 0.08s;
  }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }

  /* Mode picker — small enough to stay out of a 3yo's way but tappable for parents */
  #mode {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    font-size: 15px;
    font-weight: 700;
    color: #333;
    user-select: none;
  }
  #mode label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  #mode input[type="radio"] {
    width: 18px;
    height: 18px;
    accent-color: #4568dc;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="display"></div>
  <div class="hint">Press any letter key!</div>
  <div id="mode">
    <label><input type="radio" name="mode" value="music"> Music only</label>
    <label><input type="radio" name="mode" value="both" checked> Music + Words</label>
  </div>
  <div id="keyboard"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const WORDS = {
      A: 'Apple',   B: 'Ball',    C: 'Cat',     D: 'Dog',
      E: 'Egg',     F: 'Fish',    G: 'Goat',    H: 'Hat',
      I: 'Ice',     J: 'Jam',     K: 'Kite',    L: 'Lion',
      M: 'Moon',    N: 'Nest',    O: 'Orange',  P: 'Pig',
      Q: 'Queen',   R: 'Rabbit',  S: 'Sun',     T: 'Tree',
      U: 'Umbrella',V: 'Van',     W: 'Whale',   X: 'Xylophone',
      Y: 'Yo-yo',   Z: 'Zebra'
    };
    const COLORS = ['#ff4757','#ffa502','#feca57','#2ed573','#1e90ff','#a55eea','#ff6b9d','#ff6348','#70a1ff'];

    const display = document.getElementById('display');

    // Mode: 'both' (chime + speak) or 'music' (chime only)
    let mode = 'both';
    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.addEventListener('change', e => { mode = e.target.value; });
    });

    function showLetter(ch) {
      ch = ch.toUpperCase();
      if (!WORDS[ch]) return;

      // Remove any existing letters
      display.querySelectorAll('.big-letter').forEach(el => {
        el.classList.add('fade');
        setTimeout(() => el.remove(), 400);
      });

      const el = document.createElement('div');
      el.className = 'big-letter';
      el.textContent = ch;
      el.style.color = KidsUtil.rand(COLORS);
      display.appendChild(el);

      KidsAudio.playChime('yay');
      if (mode === 'both') {
        KidsAudio.speak(`${ch}! ${WORDS[ch]}`, { rate: 0.9, pitch: 1.2 });
      }

      // Auto-fade after a bit
      setTimeout(() => {
        if (el.parentNode) {
          el.classList.add('fade');
          setTimeout(() => el.remove(), 400);
        }
      }, 1800);
    }

    // Physical keyboard
    window.addEventListener('keydown', (e) => {
      if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
        showLetter(e.key);
      }
    });

    // Onscreen touch keyboard (6 rows × ~5 cols for tablet/phone)
    const rows = ['ABCDE', 'FGHIJ', 'KLMNO', 'PQRST', 'UVWXY', 'Z'];
    const kb = document.getElementById('keyboard');
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row';
      [...r].forEach(ch => {
        const key = document.createElement('div');
        key.className = 'key';
        key.textContent = ch;
        const tap = (e) => { e.preventDefault(); showLetter(ch); };
        key.addEventListener('click', tap);
        key.addEventListener('touchstart', tap, { passive: false });
        row.appendChild(key);
      });
      kb.appendChild(row);
    });
  </script>
</body>
</html>
