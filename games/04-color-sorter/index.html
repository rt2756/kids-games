<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Color Sorter</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #6a82fb 0%, #fc5c7d 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    color: white;
    font-size: clamp(28px, 4.5vw, 44px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin: 20px 0 10px;
  }
  #fruit-zone {
    flex: 1;
    position: relative;
  }
  .fruit {
    position: absolute;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: transform 0.1s;
  }
  .fruit.dragging { cursor: grabbing; transform: scale(1.15); z-index: 10; }
  .fruit.wrong  { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-15px) rotate(-5deg); }
    75%     { transform: translateX(15px)  rotate(5deg); }
  }

  #baskets {
    display: flex;
    justify-content: space-around;
    padding: 20px 8px 30px;
    gap: 6px;
  }
  .basket {
    width: clamp(70px, 12vw, 130px);
    height: clamp(80px, 13vw, 120px);
    border-radius: 20px 20px 40px 40px;
    border: 6px solid rgba(0,0,0,0.25);
    border-top: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 4vw, 36px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  .basket.hover { transform: scale(1.1); }
  .basket.red    { background: #ff4757; }
  .basket.yellow { background: #feca57; }
  .basket.blue   { background: #1e90ff; }
  .basket.green  { background: #2ed573; }
  .basket.white  { background: #ffffff; color: #888; }
  .basket.black  { background: #2f3542; color: #fff; }
  .basket.pink   { background: #ff6b9d; }
</style>
</head>
<body>
  <h1>Put each thing in the right basket!</h1>
  <div id="fruit-zone"></div>
  <div id="baskets">
    <div class="basket red"    data-color="red">🧺</div>
    <div class="basket yellow" data-color="yellow">🧺</div>
    <div class="basket blue"   data-color="blue">🧺</div>
    <div class="basket green"  data-color="green">🧺</div>
    <div class="basket white"  data-color="white">🧺</div>
    <div class="basket black"  data-color="black">🧺</div>
    <div class="basket pink"   data-color="pink">🧺</div>
  </div>

  <script src="../../shared/common.js"></script>
  <script>
    const FRUITS = [
      { emoji: '🍎', color: 'red',    name: 'Apple'      },
      { emoji: '🍓', color: 'red',    name: 'Strawberry' },
      { emoji: '🍌', color: 'yellow', name: 'Banana'     },
      { emoji: '🍋', color: 'yellow', name: 'Lemon'      },
      { emoji: '🫐', color: 'blue',   name: 'Blueberry'  },
      { emoji: '🐳', color: 'blue',   name: 'Whale'      },
      { emoji: '🥝', color: 'green',  name: 'Kiwi'       },
      { emoji: '🐸', color: 'green',  name: 'Frog'       },
      { emoji: '🥛', color: 'white',  name: 'Milk'       },
      { emoji: '🥚', color: 'white',  name: 'Egg'        },
      { emoji: '🎱', color: 'black',  name: 'Eight ball' },
      { emoji: '🐈‍⬛', color: 'black',  name: 'Black cat'  },
      { emoji: '🌸', color: 'pink',   name: 'Blossom'    },
      { emoji: '🦩', color: 'pink',   name: 'Flamingo'   },
    ];

    const zone = document.getElementById('fruit-zone');
    const baskets = document.querySelectorAll('.basket');

    // Place a fruit near the top-center of the fruit zone (zone-relative coords)
    function placeAtStart(el) {
      const zw = zone.clientWidth;
      const zh = zone.clientHeight;
      el.style.left = (zw / 2 - 65) + 'px';
      el.style.top  = Math.max(20, zh * 0.25 - 65) + 'px';
    }

    function spawnFruit() {
      const f = KidsUtil.rand(FRUITS);
      const el = document.createElement('div');
      el.className = 'fruit';
      el.textContent = f.emoji;
      el.dataset.color = f.color;
      el.dataset.name = f.name;
      zone.appendChild(el);
      placeAtStart(el);

      KidsAudio.speak(f.name);
      makeDraggable(el);
    }

    function makeDraggable(el) {
      let ox = 0, oy = 0, dragging = false;

      const onDown = (e) => {
        dragging = true;
        el.classList.add('dragging');
        const rect = el.getBoundingClientRect();
        const p = getPoint(e);
        ox = p.x - rect.left;
        oy = p.y - rect.top;
        e.preventDefault();
      };
      const onMove = (e) => {
        if (!dragging) return;
        const p = getPoint(e);
        // Convert viewport coords to fruit-zone-relative coords, since the
        // fruit is positioned absolutely inside #fruit-zone (not the viewport).
        const zr = zone.getBoundingClientRect();
        el.style.left = (p.x - ox - zr.left) + 'px';
        el.style.top  = (p.y - oy - zr.top)  + 'px';

        // Highlight hovered basket
        const over = basketUnder(p.x, p.y);
        baskets.forEach(b => b.classList.toggle('hover', b === over));
      };
      const onUp = (e) => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        const p = getPoint(e.changedTouches ? e.changedTouches[0] : e);
        const over = basketUnder(p.x, p.y);
        baskets.forEach(b => b.classList.remove('hover'));

        if (over && over.dataset.color === el.dataset.color) {
          // Correct!
          KidsAudio.playChime('yay');
          KidsAudio.speak('Yay!');
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          el.remove();
          setTimeout(spawnFruit, 500);
        } else {
          // Wrong or dropped in empty space -> shake then bounce back to start
          el.classList.add('wrong');
          KidsAudio.playChime('uhoh');
          setTimeout(() => {
            el.classList.remove('wrong');
            placeAtStart(el);
          }, 400);
        }
      };

      el.addEventListener('pointerdown', onDown);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    function getPoint(e) {
      if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
      const t = e.touches ? e.touches[0] : e.changedTouches[0];
      return { x: t.clientX, y: t.clientY };
    }

    function basketUnder(x, y) {
      for (const b of baskets) {
        const r = b.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return b;
      }
      return null;
    }

    // Start with one fruit
    spawnFruit();
  </script>
</body>
</html>
