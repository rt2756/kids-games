<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Paint Splash</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: #fffaf0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    cursor: crosshair;
  }
  #canvas {
    position: absolute;
    inset: 0;
  }
  .splat {
    position: absolute;
    pointer-events: none;
    animation: splat-in 0.35s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
    user-select: none;
  }
  @keyframes splat-in {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-30deg); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(var(--rot)); opacity: 1; }
  }
  .sticker {
    position: absolute;
    font-size: clamp(60px, 10vw, 100px);
    pointer-events: none;
    animation: sticker-in 0.4s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
    user-select: none;
  }
  @keyframes sticker-in {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(0); }
    60%  { transform: translate(-50%,-50%) scale(1.3) rotate(15deg); }
    100% { transform: translate(-50%,-50%) scale(1) rotate(var(--rot)); }
  }
  #clear {
    position: fixed;
    top: 16px;
    /* Sit to the left of the shared theme toggle (64px wide at right:16px)
       so the two top-right buttons no longer overlap. */
    right: 96px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    border: none;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    z-index: 999;
    transition: transform 0.1s;
  }
  #clear:active { transform: scale(0.9); }
  .hint {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #999;
    font-size: 32px;
    font-weight: 800;
    pointer-events: none;
    opacity: 0.6;
    text-align: center;
    user-select: none;
  }
  .hint.gone { animation: fade-hint 0.5s forwards; }
  @keyframes fade-hint { to { opacity: 0; } }
</style>
</head>
<body>
  <div id="canvas"></div>
  <div class="hint" id="hint">Tap or drag anywhere!</div>
  <button id="clear" aria-label="Clear">🗑️</button>

  <script src="../../shared/common.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const clearBtn = document.getElementById('clear');
    const hint = document.getElementById('hint');

    const COLORS = ['#ff4757','#ffa502','#feca57','#2ed573','#1e90ff','#a55eea','#ff6b9d','#ff6348','#5f27cd'];
    const STICKERS = ['⭐','🌈','🌺','🦋','🌟','💖','🌸','🎈','🍭','🐝','🦄','🌼'];

    function ink(x, y) {
      const color = KidsUtil.rand(COLORS);
      const size = 80 + Math.random() * 90;
      const rot = Math.random() * 360;

      // SVG ink blob with irregular edges
      const el = document.createElement('div');
      el.className = 'splat';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.setProperty('--rot', rot + 'deg');
      el.innerHTML = `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <path d="M50,5 C70,5 95,25 90,50 C95,75 70,95 50,90 C30,95 5,75 10,50 C5,25 30,5 50,10 Z
                   M60,20 C50,15 30,25 25,40 C20,55 30,70 45,75 C60,80 80,65 75,50 C80,35 70,25 60,20 Z"
                fill="${color}"/>
        </svg>`;
      canvas.appendChild(el);

      // Occasionally add an emoji sticker on top
      if (Math.random() < 0.35) {
        const s = document.createElement('div');
        s.className = 'sticker';
        s.textContent = KidsUtil.rand(STICKERS);
        s.style.left = x + 'px';
        s.style.top  = y + 'px';
        s.style.setProperty('--rot', (Math.random() * 30 - 15) + 'deg');
        canvas.appendChild(s);
      }

      KidsAudio.playPop();
    }

    let drawing = false, lastT = 0;
    const paint = (e) => {
      e.preventDefault();
      const p = getPoint(e);
      const now = performance.now();
      // Throttle so drags don't spawn hundreds of splats
      if (now - lastT < 90) return;
      lastT = now;
      ink(p.x, p.y);
      if (!hint.classList.contains('gone')) {
        hint.classList.add('gone');
        setTimeout(() => hint.remove(), 500);
      }
    };

    function getPoint(e) {
      if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
      const t = e.touches ? e.touches[0] : e.changedTouches[0];
      return { x: t.clientX, y: t.clientY };
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#clear') || e.target.closest('.back-btn')) return;
      drawing = true;
      paint(e);
    });
    document.addEventListener('pointermove', (e) => { if (drawing) paint(e); });
    document.addEventListener('pointerup',   () => { drawing = false; });

    clearBtn.addEventListener('click', () => {
      canvas.innerHTML = '';
      KidsAudio.playChime('yay');
    });
  </script>
</body>
</html>
