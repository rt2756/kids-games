<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Where's the Cat?</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #f953c6 0%, #b91d73 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    color: white;
    font-size: clamp(28px, 4.5vw, 44px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin: 20px 0;
    text-align: center;
  }

  #stage {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 80px;
  }

  /* Ground line */
  #stage::after {
    content: '';
    position: absolute;
    bottom: 70px;
    left: 5%;
    right: 5%;
    height: 6px;
    background: rgba(255,255,255,0.6);
    border-radius: 3px;
  }

  .slot {
    position: absolute;
    bottom: 70px;
    width: 180px;
    height: 220px;
    transition: left 0.7s cubic-bezier(0.5, 0, 0.5, 1);
  }

  .cup {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 220px;
    cursor: pointer;
    transform-origin: bottom center;
    transition: transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
    user-select: none;
  }
  .cup svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 12px rgba(0,0,0,0.3)); }
  .cup.lifted { transform: translateY(-180px) rotate(8deg); }

  .cat {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 140px;
    line-height: 1;
    user-select: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .cat.show { opacity: 1; animation: cat-jump 0.7s ease-in-out; }
  @keyframes cat-jump {
    0%,100% { transform: translateX(-50%) translateY(0); }
    40%     { transform: translateX(-50%) translateY(-40px) scale(1.1); }
  }

  #status {
    position: fixed;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: 800;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    pointer-events: none;
  }
</style>
</head>
<body>
  <h1 id="title">Watch the cat!</h1>
  <div id="stage"></div>
  <div id="status"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const title = document.getElementById('title');
    const status = document.getElementById('status');

    const CUP_SVG = `
      <svg viewBox="0 0 180 220">
        <defs>
          <linearGradient id="g" x1="0" x2="1">
            <stop offset="0" stop-color="#ffb74d"/>
            <stop offset="1" stop-color="#f57c00"/>
          </linearGradient>
        </defs>
        <path d="M20,40 L160,40 L150,210 L30,210 Z" fill="url(#g)" stroke="#c65100" stroke-width="6" stroke-linejoin="round"/>
        <ellipse cx="90" cy="40" rx="70" ry="14" fill="#c65100"/>
        <ellipse cx="90" cy="40" rx="60" ry="8" fill="#5d2e00"/>
      </svg>`;

    const N_SLOTS = 3;
    let positions = [0, 1, 2]; // visual position index -> slot id
    let catAt = 0;              // slot id where cat is hiding
    let locked = true;

    function layoutSlots() {
      const W = stage.clientWidth;
      // The cups are drawn 180px wide. On a narrow screen three of them do
      // not fit, so shrink them (scaled from the bottom, so they stay on
      // the ground line) and space them by their shrunken width.
      const scale = Math.min(1, W / 600);
      const slotW = 180 * scale;
      const gap = Math.min(60, (W - slotW * N_SLOTS) / (N_SLOTS + 1));
      const start = (W - (slotW * N_SLOTS + gap * (N_SLOTS - 1))) / 2 - (180 - slotW) / 2;

      document.querySelectorAll('.slot').forEach(slot => {
        const visualPos = positions.indexOf(parseInt(slot.dataset.id, 10));
        slot.style.left = (start + visualPos * (slotW + gap)) + 'px';
        slot.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
        slot.style.transformOrigin = 'bottom center';
      });
    }

    function buildSlots() {
      stage.innerHTML = '';
      for (let i = 0; i < N_SLOTS; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.id = i;
        slot.innerHTML = `
          <div class="cat">🐱</div>
          <div class="cup">${CUP_SVG}</div>
        `;
        stage.appendChild(slot);

        const cup = slot.querySelector('.cup');
        cup.addEventListener('click', () => onCupClick(i));
        cup.addEventListener('touchstart', (e) => { e.preventDefault(); onCupClick(i); }, { passive: false });
      }
      layoutSlots();
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function startRound() {
      locked = true;
      status.textContent = '';
      title.textContent = 'Watch the cat!';
      buildSlots();

      // Pick a random slot for the cat
      catAt = Math.floor(Math.random() * N_SLOTS);
      const catEl = stage.querySelector(`.slot[data-id="${catAt}"] .cat`);
      const cupEl = stage.querySelector(`.slot[data-id="${catAt}"] .cup`);

      // Reveal cat by lifting its cup
      catEl.classList.add('show');
      cupEl.classList.add('lifted');
      KidsAudio.speak('Here is the cat!');
      await sleep(1500);

      // Cup comes back down
      cupEl.classList.remove('lifted');
      await sleep(600);
      catEl.classList.remove('show');

      // Shuffle: swap a few pairs slowly
      title.textContent = 'Where did it go?';
      const swaps = 3;
      for (let s = 0; s < swaps; s++) {
        const i = Math.floor(Math.random() * N_SLOTS);
        let j = Math.floor(Math.random() * N_SLOTS);
        while (j === i) j = Math.floor(Math.random() * N_SLOTS);
        [positions[i], positions[j]] = [positions[j], positions[i]];
        layoutSlots();
        await sleep(900);
      }

      title.textContent = 'Tap the cup with the cat!';
      locked = false;
    }

    function onCupClick(slotId) {
      if (locked) return;
      locked = true;
      const slot = stage.querySelector(`.slot[data-id="${slotId}"]`);
      const cup = slot.querySelector('.cup');
      const cat = slot.querySelector('.cat');

      cup.classList.add('lifted');

      if (slotId === catAt) {
        cat.classList.add('show');
        KidsAudio.playChime('yay');
        KidsAudio.speak('You found me!');
        status.textContent = 'Yay!';
        setTimeout(() => { positions = [0,1,2]; startRound(); }, 2400);
      } else {
        KidsAudio.playChime('uhoh');
        KidsAudio.speak('Not there! Look again');
        setTimeout(() => {
          // Reveal the real cat location
          const realSlot = stage.querySelector(`.slot[data-id="${catAt}"]`);
          realSlot.querySelector('.cup').classList.add('lifted');
          realSlot.querySelector('.cat').classList.add('show');
          KidsAudio.speak('There it is!');
          status.textContent = 'There it is!';
          setTimeout(() => { positions = [0,1,2]; startRound(); }, 2400);
        }, 700);
      }
    }

    window.addEventListener('load', startRound);
    window.addEventListener('resize', layoutSlots);
  </script>
</body>
</html>
