<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Shape Hunt</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<link rel="stylesheet" href="../../shared/kit.css" />
<style>
  body { --av-bg: linear-gradient(180deg,#d9f2ff,#a6c1ee); --av-ink: #1f3a6e; }
  .shape { width:clamp(90px,24vmin,150px); height:clamp(90px,24vmin,150px); filter:drop-shadow(0 6px 6px rgba(0,0,0,.2)); }
</style>
</head>
<body>
  <script src="../../shared/common.js"></script>
  <script src="../../shared/kit.js"></script>
  <script>
    // Concept: shapes in the real world — a clock is a circle, a door is a rectangle.
    const K = KidsKit, U = KidsUtil;
    const SHAPES = {
      circle:    { svg: '<circle cx="50" cy="50" r="42"/>', fill: '#ff7043', not: [],
        things: [['ball','⚽'],['cookie','🍪'],['clock','🕐'],['coin','🪙'],['wheel','🛞'],['orange','🍊']] },
      square:    { svg: '<rect x="10" y="10" width="80" height="80" rx="4"/>', fill: '#42a5f5', not: ['rectangle'],
        things: [['picture frame','🖼️'],['waffle','🧇'],['window','🪟'],['gift box','🎁']] },
      triangle:  { svg: '<polygon points="50,8 94,90 6,90"/>', fill: '#66bb6a', not: [],
        things: [['pizza slice','🍕'],['tent','⛺'],['set square','📐'],['warning sign','⚠️'],['mountain','⛰️']] },
      rectangle: { svg: '<rect x="6" y="24" width="88" height="52" rx="4"/>', fill: '#ab47bc', not: ['square'],
        things: [['door','🚪'],['book','📕'],['money note','💵'],['brick','🧱'],['phone','📱'],['television','📺']] },
    };
    const draw = K.bag(Object.keys(SHAPES));
    K.quiz({ next(round) {
      const s = draw(), S = SHAPES[s], thing = U.rand(S.things);
      const others = U.shuffle(Object.keys(SHAPES).filter(k => k !== s && !S.not.includes(k))).slice(0, 2)
        .map(k => ({ shape: k, thing: U.rand(SHAPES[k].things) }));
      const an = s => 'a ' + s;
      return {
        title: 'Which one is shaped like ' + an(s) + '?',
        show: '<svg class="shape" viewBox="0 0 100 100" fill="' + S.fill + '">' + S.svg + '</svg><div class="av-word">' + s + '</div>',
        say: 'This is ' + an(s) + '. Which one is shaped like ' + an(s) + '?',
        choices: U.shuffle([{ shape: s, thing }].concat(others)).map(o => ({ html: K.card(o.thing[1]), ok: o.shape === s,
          say: 'The ' + o.thing[0] + ' is ' + an(o.shape) + '. Find ' + an(s) + '.' })),
        praise: 'Yes! The ' + thing[0] + ' is ' + an(s) + '!',
      };
    } });
  </script>
</body>
</html>
