<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Spot the Difference</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<link rel="stylesheet" href="../../shared/kit.css" />
<style>
  body { --av-bg: linear-gradient(180deg,#a8edea,#fed6e3); --av-ink: #2d4a6b; }
  .pair { display:flex; gap:14px; align-items:center; justify-content:center; }
  .pane { display:grid; gap:3px; background:#fff; border-radius:16px; padding:6px; box-shadow:0 6px 16px rgba(0,0,0,.18); box-sizing:border-box; }
  .cell { border:none; background:#f4f6fb; border-radius:14%; padding:0; font-size:inherit; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; overflow:hidden; }
  .cell span { display:block; transition:none; }
  .cell.got { background:#b6f09c; box-shadow:inset 0 0 0 3px #22c55e; }
  .cell.wrong { animation:av-shake .35s; }
</style>
</head>
<body>
  <script src="../../shared/common.js"></script>
  <script src="../../shared/kit.js"></script>
  <script>
    // Concept: looking carefully. Two pictures; tap what changed in either one.
    // Early levels swap one whole picture, later ones shrink, turn or remove it.
    const K = KidsKit, A = KidsAudio, U = KidsUtil;
    const POOL = [...'🐶🐱🐰🦊🐻🐼🐸🐵🐔🐧🦉🦋🐢🐠🐙🦀🍎🍌🍇🍓🍉🥕🌽🍄🌸🌻🌳🌵⭐🌙☀️🌈🚗🚌🚲🚀⚽🎈🎁🧸'].filter(c => c !== '️');
    const LEVELS = [[2, 1], [3, 1], [3, 2], [4, 2], [4, 3], [5, 3], [5, 4], [6, 5]];
    const INTRO = 'Look carefully. What is different? Tap it!';
    const S = K.shell(INTRO, [['🔄 Again', () => L.go(L.n)], ['💡 Hint', hint]]);
    const wrap = K.el('div', 'pair'), left = K.el('div', 'pane'), right = K.el('div', 'pane'); wrap.append(left, right); S.fit.appendChild(wrap);
    let N, diffs, found, misses, locked, timer, first = true;
    function size() {
      const W = S.fit.clientWidth, H = S.fit.clientHeight, side = W > H;
      const s = Math.floor(Math.min(side ? (W - 14) / 2 : W, side ? H : (H - 14) / 2, 460));
      wrap.style.flexDirection = side ? 'row' : 'column';
      [left, right].forEach(p => { p.style.width = p.style.height = s + 'px'; p.style.gridTemplateColumns = p.style.gridTemplateRows = 'repeat(' + N + ',1fr)'; p.style.fontSize = Math.floor(s / N * .62) + 'px'; });
    }
    function tap(i, node) {
      if (locked || found.has(i)) return;
      K.wake();
      if (!diffs.has(i)) { K.wrong(node); ++misses; return K.say('Those two are the same. Keep looking.'); }
      found.add(i); misses = 0; A.playPop(); K.tone(880, .2, .25); [left, right].forEach(p => [...p.children].forEach(c => c.classList.remove('av-glow')));
      [left, right].forEach(p => { p.children[i].classList.remove('av-glow'); p.children[i].classList.add('got'); });
      S.sub.textContent = 'Found ' + found.size + ' of ' + diffs.size;
      if (found.size === diffs.size) { locked = true; timer = K.won(diffs.size === 1 ? 'You spotted it!' : 'You found all ' + diffs.size + '!', () => L.win()); }
      else K.say('Yes! ' + (diffs.size - found.size) + ' more.');
    }
    // A hint lights the row the difference is in, never the cell itself.
    function hint() {
      if (locked) return; K.wake();
      const i = [...diffs].find(d => !found.has(d)), r = Math.floor(i / N);
      [...right.children].forEach((c, j) => c.classList.toggle('av-glow', Math.floor(j / N) === r && !found.has(j)));
      K.say('Look along this row.');
    }
    const L = K.levels('spot-the-difference', S.ui, n => {
      clearTimeout(timer);
      let k; [N, k] = LEVELS[Math.min(n, LEVELS.length - 1)];
      const cells = U.shuffle(POOL).slice(0, N * N), spare = U.shuffle(POOL.filter(c => !cells.includes(c)));
      diffs = new Set(U.shuffle([...cells.keys()]).slice(0, k)); found = new Set(); misses = 0; locked = false;
      left.innerHTML = right.innerHTML = '';
      cells.forEach((c, i) => {
        [left, right].forEach(p => {
          const b = K.el('button', 'cell', '<span>' + c + '</span>');
          if (p === right && diffs.has(i)) {
            const how = n < 2 ? 0 : Math.floor(Math.random() * 4);
            if (how === 0) b.firstChild.textContent = spare.pop();
            else if (how === 1) b.firstChild.style.transform = 'scale(.5)';
            else if (how === 2) b.firstChild.style.transform = 'rotate(180deg)';
            else b.firstChild.textContent = '';
          }
          b.onclick = () => tap(i, b);
          p.appendChild(b);
        });
      });
      size();
      S.sub.textContent = INTRO;
      K.say(first ? INTRO : k === 1 ? 'Find the one thing that is different.' : 'Find ' + k + ' things that are different.'); first = false;
    });
    addEventListener('resize', size);
    L.begin();
  </script>
</body>
</html>
