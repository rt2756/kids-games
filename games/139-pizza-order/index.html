<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Pizza Order</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<link rel="stylesheet" href="../../shared/kit.css" />
<style>
  body { --av-bg: linear-gradient(180deg,#f5af19,#f12711); --av-ink: #fff; }
  .pizza { position:relative; border-radius:50%; background:radial-gradient(circle, #ffd76a 0 58%, #f4a83a 59% 64%, #d98a2b 65% 100%); box-shadow:0 8px 0 rgba(0,0,0,.2); }
  .pizza.baked { filter:saturate(1.3) brightness(1.05); animation:av-pulse .6s 2; }
  .top { position:absolute; transform:translate(-50%,-50%); border:none; background:none; padding:0; font-size:inherit; line-height:1; cursor:pointer; }
  .order { display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center; background:#fff; color:#333; border-radius:16px; padding:8px 16px; font-size:clamp(18px,4.6vmin,30px); box-shadow:0 5px 0 rgba(0,0,0,.18); }
  .order b { font-weight:900; margin-left:4px; }
  .topb { font-size:clamp(24px,6vmin,36px) !important; padding:8px 18px !important; }
</style>
</head>
<body>
  <script src="../../shared/common.js"></script>
  <script src="../../shared/kit.js"></script>
  <script>
    // Concept: counting out to a spoken order with more than one part
    // ("three mushrooms and two olives"). Tap a topping to add it, tap it on
    // the pizza to take it off, then bake. A wrong pizza is never thrown away —
    // the cook says which topping to count again.
    const K = KidsKit, A = KidsAudio, U = KidsUtil;
    const TOPS = [['🍄', 'mushroom'], ['🫒', 'olive'], ['🍅', 'tomato'], ['🌽', 'corn'], ['🫑', 'pepper'], ['🧀', 'cheese']];
    const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six'];
    const S = K.shell('', []);
    const pizza = K.el('div', 'pizza'), card = K.el('div', 'order'), tray = K.el('div', 'av-bar');
    S.fit.appendChild(pizza); S.ui.stage.insertBefore(card, S.fit); S.ui.stage.insertBefore(tray, S.bar);
    S.ui.setTitle('Pizza order!');
    let order, round = 0, misses, locked, timer;
    const plural = (n, w) => WORDS[n] + ' ' + (n === 1 ? w : w === 'tomato' ? 'tomatoes' : w === 'cheese' || w === 'corn' ? 'pieces of ' + w : w + 's');
    const count = e => [...pizza.children].filter(t => t.textContent === e).length;
    function size() { const s = Math.floor(Math.min(S.fit.clientWidth, S.fit.clientHeight, 460)); pizza.style.width = pizza.style.height = s + 'px'; pizza.style.fontSize = Math.floor(s * .13) + 'px'; }
    function show() {
      card.innerHTML = order.map(o => '<span>' + o.e.repeat(o.n) + ' <b>' + (misses >= 2 ? count(o.e) + '/' : '') + o.n + '</b></span>').join('');
    }
    function add(e) {
      if (locked || pizza.children.length >= 18) return;
      const t = K.el('button', 'top av-pop', e), a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * 36;
      t.style.left = (50 + Math.cos(a) * r) + '%'; t.style.top = (50 + Math.sin(a) * r) + '%';
      t.onclick = () => { if (locked) return; t.remove(); A.playPop(); show(); };
      pizza.appendChild(t); A.playPop(); K.say(WORDS[count(e)] || ''); show();
    }
    function bake() {
      if (locked) return;
      const bad = order.find(o => count(o.e) !== o.n), extra = [...pizza.children].find(t => !order.some(o => o.e === t.textContent));
      if (!bad && !extra) { locked = true; pizza.classList.add('baked'); timer = K.won('Perfect pizza! Yum yum!', next); return; }
      misses++; A.playChime('uhoh'); show();
      K.say(bad ? 'Count the ' + bad.w + ' again. We need ' + plural(bad.n, bad.w) + '.' : 'There is something extra on the pizza. Tap it to take it off.');
    }
    function next() {
      clearTimeout(timer);
      const kinds = round < 3 ? 1 : round < 9 ? 2 : 3, max = round < 6 ? 3 : 5;
      order = U.shuffle(TOPS).slice(0, kinds).map(t => ({ e: t[0], w: t[1], n: 1 + Math.floor(Math.random() * max) }));
      round++; misses = 0; locked = false; pizza.innerHTML = ''; pizza.classList.remove('baked'); tray.innerHTML = '';
      const offer = order.map(o => o.e); if (round > 2) offer.push(TOPS.find(t => !offer.includes(t[0]))[0]);
      U.shuffle(offer).forEach(e => { const b = K.el('button', 'av-btn topb', e); b.onclick = () => { K.wake(); add(e); }; tray.appendChild(b); });
      S.intro = 'The order is ' + order.map(o => plural(o.n, o.w)).join(' and ') + '.';
      S.sub.textContent = S.intro; show(); size(); K.say(S.intro);
    }
    S.button('🔥 Bake', bake);
    addEventListener('resize', size);
    next();
  </script>
</body>
</html>
