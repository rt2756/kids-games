<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Build &amp; Smash</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #74ebd5 0%, #acb6e5 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }
  #grass {
    position: fixed;
    bottom: 0;
    width: 100vw;
    height: 70px;
    background: linear-gradient(180deg, #7ec850, #5cab38);
    z-index: 2;
  }
  h1 {
    text-align: center;
    color: white;
    font-size: clamp(26px, 4.5vw, 42px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin: 16px 0 0;
  }
  #count {
    text-align: center;
    color: rgba(255,255,255,0.95);
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    margin: 0;
    min-height: 1.2em;
  }

  #tower {
    position: fixed;
    bottom: 70px;
    left: 50%;
    width: 0;
    z-index: 3;
    transform-origin: bottom center;
  }
  #tower.wobbly { animation: wobble 1.6s ease-in-out infinite; }
  @keyframes wobble {
    0%,100% { transform: rotate(-1.2deg); }
    50%     { transform: rotate(1.2deg); }
  }

  .block {
    position: absolute;
    width: 130px;
    height: 62px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.2);
    user-select: none;
    transition: bottom 0.45s cubic-bezier(0.3, 1.4, 0.6, 1);
    z-index: 3;
  }
  .block.flying { transition: none; z-index: 4; }

  .bigbtn {
    position: fixed;
    bottom: 90px;
    z-index: 10;
    border: none;
    border-radius: 999px;
    padding: 20px 30px;
    font-size: clamp(22px, 3.5vw, 32px);
    font-weight: 900;
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.3);
    user-select: none;
    transition: transform 0.1s;
  }
  .bigbtn:active { transform: scale(0.92); }
  #add   { left: 6vw;  background: linear-gradient(135deg, #11998e, #38ef7d); }
  #smash {
    right: 6vw;
    background: linear-gradient(135deg, #eb3349, #f45c43);
    display: none;
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.12) rotate(-2deg); }
  }

  .confetti {
    position: fixed;
    font-size: 30px;
    pointer-events: none;
    z-index: 500;
    animation: fall 1.7s ease-in forwards;
  }
  @keyframes fall {
    from { transform: translateY(-40px) rotate(0);      opacity: 1; }
    to   { transform: translateY(105vh) rotate(380deg); opacity: 0.8; }
  }
</style>
</head>
<body>
  <h1>Build a tower! 🧱</h1>
  <p id="count"></p>
  <div id="tower"></div>
  <div id="grass"></div>
  <button id="add" class="bigbtn">➕ Block!</button>
  <button id="smash" class="bigbtn">💥 SMASH!</button>

  <script src="../../shared/common.js"></script>
  <script>
    const WORDS = ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
    const COLORS = ['#ff4757', '#1e90ff', '#feca57', '#2ed573', '#9b59b6', '#ff7f50', '#ff6b9d', '#00cec9'];
    const FACES = ['😊', '😄', '🐱', '⭐', '🦄', '🐻', '🌈', '🐸'];
    const BLOCK_H = 62, GAP = 4, MAX = 10;

    const tower = document.getElementById('tower');
    const countEl = document.getElementById('count');
    const addBtn = document.getElementById('add');
    const smashBtn = document.getElementById('smash');

    let blocks = [];
    let dropping = false;
    let smashing = false;

    function thunk() {
      const ac = KidsAudio.getAudio(), now = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(130, now);
      o.frequency.exponentialRampToValueAtTime(50, now + 0.12);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.5, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      o.connect(g).connect(ac.destination);
      o.start(now); o.stop(now + 0.2);
    }
    function crash() {
      const ac = KidsAudio.getAudio(), now = ac.currentTime;
      const len = ac.sampleRate * 0.45;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 800;
      const g = ac.createGain(); g.gain.value = 0.6;
      src.connect(f).connect(g).connect(ac.destination);
      src.start(now);
      [300, 220, 150].forEach((fr, i) => {
        const o = ac.createOscillator(), og = ac.createGain();
        o.type = 'square'; o.frequency.value = fr;
        const t = now + 0.1 + i * 0.12;
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(0.2, t + 0.01);
        og.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        o.connect(og).connect(ac.destination);
        o.start(t); o.stop(t + 0.2);
      });
    }

    addBtn.addEventListener('pointerdown', () => {
      if (dropping || smashing) return;
      if (blocks.length >= MAX) {
        KidsAudio.speak("It's so tall! Smash it!");
        return;
      }
      dropping = true;
      const n = blocks.length;
      const el = document.createElement('div');
      el.className = 'block';
      el.style.background = COLORS[n % COLORS.length];
      el.textContent = FACES[Math.floor(Math.random() * FACES.length)];
      const jitter = (Math.random() - 0.5) * 16;
      el.style.left = (-65 + jitter) + 'px';
      el.style.bottom = (window.innerHeight) + 'px';
      tower.appendChild(el);
      blocks.push(el);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.bottom = (n * (BLOCK_H + GAP)) + 'px';
      }));
      setTimeout(() => {
        thunk();
        dropping = false;
        countEl.textContent = n + 1;
        KidsAudio.speak(WORDS[n] + '!');
        if (n + 1 >= 3) smashBtn.style.display = 'block';
        tower.classList.toggle('wobbly', n + 1 >= 5);
        if (n + 1 === MAX) {
          setTimeout(() => { KidsAudio.playChime('yay'); KidsAudio.speak('Wow! Ten blocks! What a tall tower!'); }, 600);
        }
      }, 470);
    });

    smashBtn.addEventListener('pointerdown', () => {
      if (smashing || blocks.length === 0) return;
      smashing = true;
      smashBtn.style.display = 'none';
      tower.classList.remove('wobbly');
      crash();
      KidsAudio.speak('CRASH! Ha ha ha!');
      confettiBurst();

      const floor = window.innerHeight - 70;
      const bodies = blocks.map(el => {
        const r = el.getBoundingClientRect();
        document.body.appendChild(el);
        el.classList.add('flying');
        el.style.left = r.left + 'px';
        el.style.top = r.top + 'px';
        el.style.bottom = 'auto';
        return {
          el, x: r.left, y: r.top,
          vx: (Math.random() - 0.5) * 18,
          vy: -(4 + Math.random() * 9),
          vr: (Math.random() - 0.5) * 24,
          rot: 0, bounced: 0,
        };
      });
      blocks = [];
      countEl.textContent = '';

      const t0 = performance.now();
      function step() {
        let alive = false;
        bodies.forEach(b => {
          b.vy += 0.55;
          b.x += b.vx;
          b.y += b.vy;
          b.rot += b.vr;
          if (b.y > floor - BLOCK_H && b.vy > 0 && b.bounced < 2) {
            b.y = floor - BLOCK_H;
            b.vy *= -0.45;
            b.vx *= 0.8;
            b.bounced++;
            if (Math.abs(b.vy) > 2) thunk();
          }
          b.el.style.left = b.x + 'px';
          b.el.style.top = b.y + 'px';
          b.el.style.transform = `rotate(${b.rot}deg)`;
          if (b.y < window.innerHeight + 200) alive = true;
        });
        if (alive && performance.now() - t0 < 3000) requestAnimationFrame(step);
        else {
          bodies.forEach(b => b.el.remove());
          smashing = false;
          setTimeout(() => KidsAudio.speak("Let's build again!"), 400);
        }
      }
      requestAnimationFrame(step);
    });

    function confettiBurst() {
      const emo = ['🎉', '⭐', '💥', '✨', '🎈'];
      for (let i = 0; i < 30; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = emo[Math.floor(Math.random() * emo.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2300);
      }
    }
  </script>
</body>
</html>
