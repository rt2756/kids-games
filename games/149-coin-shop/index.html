<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Coin Shop</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<link rel="stylesheet" href="../../shared/kit.css" />
<style>
  body { --av-bg: linear-gradient(180deg,#1d976c,#93f9b9); --av-ink: #063a25; }
  .shop { display:flex; flex-direction:column; align-items:center; gap:clamp(6px,2vh,16px); width:100%; }
  .item { font-size:clamp(64px,20vmin,150px); line-height:1; position:relative; }
  .item b { position:absolute; right:-.7em; top:0; font-size:.28em; background:#ffe066; color:#333; border-radius:10px; padding:4px 10px; transform:rotate(8deg); box-shadow:0 3px 0 rgba(0,0,0,.2); }
  .counter { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; min-height:clamp(64px,16vmin,92px); width:min(100%,560px); background:rgba(255,255,255,.6); border-radius:16px; padding:8px; }
  .counter button, .pay { border:none; background:none; padding:0; cursor:pointer; font:inherit; }
  /* the coins to pay with sit right under the counter, and the whole group is centred */
  .av-fit.shopfit { flex-direction:column; gap:clamp(12px,3vh,28px); }
  .av-fit.shopfit .purse { flex-direction:row; flex-wrap:wrap; max-height:none; }
  @media (max-height: 500px) and (orientation: landscape) {
    .av-fit.shopfit { gap:6px; }
    .shop { gap:4px; }
    .item { font-size:clamp(44px,15vh,70px); }
    .counter { min-height:52px; padding:4px; }
  }
  .sum { font-weight:900; font-size:clamp(18px,4.6vmin,28px); }
  .coin, .note { display:flex; align-items:center; justify-content:center; font-weight:900; color:#3b2a00; width:clamp(46px,12vmin,68px); height:clamp(46px,12vmin,68px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3b0, #d4a017); border:3px solid #a67c00; font-size:clamp(14px,3.6vmin,20px); box-shadow:0 4px 0 rgba(0,0,0,.25); }
  .coin.c1, .coin.c2 { background:radial-gradient(circle at 35% 30%, #fff, #b0b7bd); border-color:#7d858c; transform:scale(.86); }
  .coin.c10 { border-color:#7d858c; }
  .note { border-radius:8px; width:clamp(74px,19vmin,108px); background:linear-gradient(135deg,#c8f7c5,#7bd389); border-color:#2e7d32; color:#0b3d17; }
</style>
</head>
<body>
  <script src="../../shared/common.js"></script>
  <script src="../../shared/kit.js"></script>
  <script>
    // Concept: coins and notes, and paying an exact price. Tap money to put it
    // on the counter; tap it on the counter to take it back. The currency is a
    // setting: it starts from the device's region and the button changes it.
    const K = KidsKit, A = KidsAudio, U = KidsUtil;
    const TOYS = [['🧸', 'teddy'], ['⚽', 'ball'], ['🚗', 'toy car'], ['🪁', 'kite'], ['🎈', 'balloon'], ['🍭', 'lollipop'], ['📒', 'notebook'], ['🖍️', 'crayon'], ['🪀', 'yo-yo'], ['🍌', 'banana']];
    const MONEY = [['₹', 'rupees'], ['$', 'dollars'], ['£', 'pounds'], ['€', 'euros']];
    const zone = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();
    let cur = +(localStorage.getItem('kids-currency') || (/Kolkata|Calcutta/.test(zone) ? 0 : /London/.test(zone) ? 2 : /^Europe/.test(zone) ? 3 : /^America|^Australia|^Pacific/.test(zone) ? 1 : 0));
    const S = K.shell('', [['💡 Hint', hint]]);
    const curB = S.button(MONEY[cur][0] + ' Money', () => { cur = (cur + 1) % MONEY.length; try { localStorage.setItem('kids-currency', cur); } catch (e) {} curB.textContent = MONEY[cur][0] + ' Money'; round = Math.max(0, round - 1); next(); });
    const shop = K.el('div', 'shop'), purse = K.el('div', 'av-bar purse'); S.fit.classList.add('shopfit'); S.fit.append(shop, purse);
    S.ui.setTitle('Coin shop');
    let price, paid, money, toy, round = 0, locked, timer;
    const total = () => paid.reduce((a, b) => a + b, 0);
    const coin = v => '<span class="' + (v >= 20 ? 'note' : 'coin c' + v) + '">' + MONEY[cur][0] + v + '</span>';
    function draw() {
      shop.innerHTML = '<div class="item">' + toy[0] + '<b>' + MONEY[cur][0] + price + '</b></div><div class="counter">' + paid.map((v, i) => '<button data-i="' + i + '">' + coin(v) + '</button>').join('') + '</div><div class="sum">You gave ' + MONEY[cur][0] + total() + '</div>';
    }
    shop.onclick = e => { const b = e.target.closest('button'); if (!b || locked) return; paid.splice(+b.dataset.i, 1); A.playPop(); draw(); };
    function give(v) {
      if (locked || paid.length >= 12) return;
      paid.push(v); A.playPop(); K.tone(1200, .12, .2); draw(); purse.querySelectorAll('.av-glow').forEach(x => x.classList.remove('av-glow'));
      if (total() === price) { locked = true; timer = K.won('Thank you! ' + price + ' ' + MONEY[cur][1] + ' exactly. Here is your ' + toy[1] + '.', next); }
      else if (total() > price) K.say('That is ' + total() + ' ' + MONEY[cur][1] + '. Too much! Take some back.');
      else K.say(total() + ' ' + MONEY[cur][1] + '.');
    }
    function hint() {
      if (locked) return;
      if (total() > price) return K.say('Too much. Tap a coin on the counter to take it back.');
      const v = money.slice().reverse().find(m => m <= price - total()); [...purse.children].find(b => +b.dataset.v === v).classList.add('av-glow');
    }
    function next() {
      clearTimeout(timer); locked = false; paid = [];
      const top = round < 3 ? 5 : round < 7 ? 10 : round < 12 ? 20 : 60; round++;
      money = top <= 5 ? [1, 2] : top <= 10 ? [1, 2, 5] : top <= 20 ? [1, 2, 5, 10] : [1, 2, 5, 10, 20, 50];
      price = 2 + Math.floor(Math.random() * (top - 1)); toy = U.rand(TOYS);
      purse.innerHTML = ''; money.forEach(v => { const b = K.el('button', 'pay', coin(v)); b.dataset.v = v; b.onclick = () => { K.wake(); give(v); }; purse.appendChild(b); });
      draw();
      S.intro = 'The ' + toy[1] + ' costs ' + price + ' ' + MONEY[cur][1] + '. Pay exactly ' + price + '.'; S.sub.textContent = S.intro; K.say(S.intro);
    }
    next();
  </script>
</body>
</html>
