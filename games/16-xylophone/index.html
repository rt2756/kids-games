<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Baby Xylophone</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #30cfd0 0%, #330867 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    color: white;
    font-size: clamp(26px, 4.5vw, 42px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin: 14px 0 4px;
  }
  #song {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
    border: none;
    border-radius: 999px;
    padding: 14px 22px;
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 900;
    color: #333;
    background: rgba(255,255,255,0.92);
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    user-select: none;
  }
  #song:active { transform: scale(0.94); }
  #song.playing { opacity: 0.5; pointer-events: none; }

  #bars {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6vw, 18px);
    padding: 0 12px;
    min-height: 0;
  }
  .bar {
    width: clamp(34px, 9.5vw, 92px);
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2), 0 8px 18px rgba(0,0,0,0.35);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
    color: rgba(255,255,255,0.9);
    font-weight: 900;
    font-size: clamp(16px, 2.5vw, 24px);
    transition: transform 0.08s;
    position: relative;
  }
  .bar::before, .bar::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    left: 50%;
    transform: translateX(-50%);
  }
  .bar::before { top: 14px; }
  .bar::after  { bottom: 40px; }
  .bar.hit {
    transform: scale(1.07);
    filter: brightness(1.35) drop-shadow(0 0 18px rgba(255,255,255,0.8));
  }
  #pads {
    display: flex;
    justify-content: center;
    gap: clamp(10px, 3vw, 30px);
    padding: 10px 0 22px;
  }
  .pad {
    width: clamp(64px, 13vw, 96px);
    height: clamp(64px, 13vw, 96px);
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(34px, 7vw, 52px);
    cursor: pointer;
    user-select: none;
    touch-action: none;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    transition: transform 0.08s;
  }
  .pad.hit { transform: scale(0.88); }

  .float-note {
    position: fixed;
    font-size: 34px;
    pointer-events: none;
    z-index: 100;
    animation: floatup 1.1s ease-out forwards;
  }
  @keyframes floatup {
    from { transform: translateY(0)      rotate(0)     scale(0.7); opacity: 1; }
    to   { transform: translateY(-130px) rotate(20deg) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>Baby Xylophone 🎵</h1>
  <button id="song">🎵 Twinkle Twinkle</button>
  <div id="bars"></div>
  <div id="pads">
    <div class="pad" data-p="kick">🥁</div>
    <div class="pad" data-p="bongo">🪘</div>
    <div class="pad" data-p="bell">🔔</div>
    <div class="pad" data-p="squeak">🦆</div>
  </div>

  <script src="../../shared/common.js"></script>
  <script>
    const NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
    const NAMES = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'];
    const COLORS = ['#ff4757', '#ff7f50', '#feca57', '#2ed573', '#00cec9', '#1e90ff', '#9b59b6', '#ff6b9d'];

    const barsEl = document.getElementById('bars');
    const bars = NOTES.map((f, i) => {
      const b = document.createElement('div');
      b.className = 'bar';
      b.style.background = `linear-gradient(180deg, ${COLORS[i]}, ${COLORS[i]}cc)`;
      b.style.height = (78 - i * 5.5) + '%';
      b.textContent = NAMES[i];
      b.addEventListener('pointerdown', (e) => { strike(i); floatNote(e.clientX, e.clientY); });
      barsEl.appendChild(b);
      return b;
    });

    function strike(i) {
      playNote(NOTES[i]);
      const b = bars[i];
      b.classList.remove('hit');
      void b.offsetWidth;
      b.classList.add('hit');
      setTimeout(() => b.classList.remove('hit'), 250);
    }

    function playNote(freq) {
      const ac = KidsAudio.getAudio(), now = ac.currentTime;
      [[freq, 'triangle', 0.4], [freq * 2, 'sine', 0.12], [freq * 3, 'sine', 0.05]].forEach(([f, type, vol]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(vol, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
        o.connect(g).connect(ac.destination);
        o.start(now); o.stop(now + 1);
      });
    }

    const PADS = {
      kick:  () => { const ac = KidsAudio.getAudio(), n = ac.currentTime;
                     const o = ac.createOscillator(), g = ac.createGain();
                     o.frequency.setValueAtTime(150, n);
                     o.frequency.exponentialRampToValueAtTime(45, n + 0.22);
                     g.gain.setValueAtTime(0.0001, n);
                     g.gain.exponentialRampToValueAtTime(0.8, n + 0.008);
                     g.gain.exponentialRampToValueAtTime(0.0001, n + 0.26);
                     o.connect(g).connect(ac.destination); o.start(n); o.stop(n + 0.3); },
      bongo: () => { const ac = KidsAudio.getAudio(), n = ac.currentTime;
                     const o = ac.createOscillator(), g = ac.createGain();
                     o.frequency.setValueAtTime(240, n);
                     o.frequency.exponentialRampToValueAtTime(160, n + 0.1);
                     g.gain.setValueAtTime(0.0001, n);
                     g.gain.exponentialRampToValueAtTime(0.5, n + 0.005);
                     g.gain.exponentialRampToValueAtTime(0.0001, n + 0.13);
                     o.connect(g).connect(ac.destination); o.start(n); o.stop(n + 0.15); },
      bell:  () => { const ac = KidsAudio.getAudio(), n = ac.currentTime;
                     [1568, 2092, 3140].forEach((f, i) => {
                       const o = ac.createOscillator(), g = ac.createGain();
                       o.frequency.value = f;
                       g.gain.setValueAtTime(0.0001, n);
                       g.gain.exponentialRampToValueAtTime(0.25 / (i + 1), n + 0.005);
                       g.gain.exponentialRampToValueAtTime(0.0001, n + 1.2);
                       o.connect(g).connect(ac.destination); o.start(n); o.stop(n + 1.3);
                     }); },
      squeak:() => { const ac = KidsAudio.getAudio(), n = ac.currentTime;
                     [[0, 800, 1500], [0.16, 900, 1650]].forEach(([t0, f1, f2]) => {
                       const o = ac.createOscillator(), g = ac.createGain();
                       o.type = 'square';
                       o.frequency.setValueAtTime(f1, n + t0);
                       o.frequency.exponentialRampToValueAtTime(f2, n + t0 + 0.1);
                       g.gain.setValueAtTime(0.0001, n + t0);
                       g.gain.exponentialRampToValueAtTime(0.12, n + t0 + 0.01);
                       g.gain.exponentialRampToValueAtTime(0.0001, n + t0 + 0.13);
                       o.connect(g).connect(ac.destination); o.start(n + t0); o.stop(n + t0 + 0.15);
                     }); },
    };
    document.querySelectorAll('.pad').forEach(p => {
      p.addEventListener('pointerdown', (e) => {
        PADS[p.dataset.p]();
        p.classList.remove('hit');
        void p.offsetWidth;
        p.classList.add('hit');
        setTimeout(() => p.classList.remove('hit'), 180);
        floatNote(e.clientX, e.clientY);
      });
    });

    function floatNote(x, y) {
      const n = document.createElement('div');
      n.className = 'float-note';
      n.textContent = KidsUtil.rand(['🎵', '🎶', '♪', '✨']);
      n.style.left = (x - 16) + 'px';
      n.style.top  = (y - 30) + 'px';
      document.body.appendChild(n);
      setTimeout(() => n.remove(), 1200);
    }

    // Twinkle Twinkle: C C G G A A G — F F E E D D C
    const SONG = [
      [0,1],[0,1],[4,1],[4,1],[5,1],[5,1],[4,2],
      [3,1],[3,1],[2,1],[2,1],[1,1],[1,1],[0,2],
    ];
    const songBtn = document.getElementById('song');
    songBtn.addEventListener('pointerdown', () => {
      songBtn.classList.add('playing');
      let t = 0;
      const BEAT = 430;
      SONG.forEach(([i, d]) => {
        setTimeout(() => strike(i), t);
        t += d * BEAT;
      });
      setTimeout(() => songBtn.classList.remove('playing'), t + 300);
    });
  </script>
</body>
</html>
