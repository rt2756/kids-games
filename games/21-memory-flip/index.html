<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Memory Match</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    text-align: center;
    color: white;
    font-size: clamp(26px, 4.5vw, 42px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin: 16px 10px 4px;
  }
  #stars {
    min-height: 30px;
    font-size: 24px;
    letter-spacing: 4px;
    user-select: none;
  }
  #board {
    flex: 1;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    align-content: center;
    justify-content: center;
    gap: clamp(10px, 2.5vw, 24px);
    padding: 10px 14px 26px;
    min-height: 0;
  }
  .card {
    width: clamp(92px, 21vw, 160px);
    height: clamp(92px, 21vw, 160px);
    perspective: 800px;
    cursor: pointer;
    user-select: none;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s ease;
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .face.front {
    background: linear-gradient(135deg, #f953c6, #b91d73);
    font-size: clamp(40px, 8vw, 64px);
    color: rgba(255,255,255,0.9);
  }
  .face.back {
    background: white;
    transform: rotateY(180deg);
    font-size: clamp(56px, 13vw, 100px);
  }
  .card.matched { pointer-events: none; }
  .card.matched .inner { animation: party 0.7s ease; }
  @keyframes party {
    0%,100% { transform: rotateY(180deg) scale(1); }
    40%     { transform: rotateY(180deg) scale(1.18) rotate(-5deg); }
    70%     { transform: rotateY(180deg) scale(1.05) rotate(4deg); }
  }
  .confetti {
    position: fixed;
    font-size: 30px;
    pointer-events: none;
    z-index: 500;
    animation: fall 1.7s ease-in forwards;
  }
  @keyframes fall {
    from { transform: translateY(-40px) rotate(0);      opacity: 1; }
    to   { transform: translateY(105vh) rotate(380deg); opacity: 0.8; }
  }
</style>
</head>
<body>
  <h1>Memory Match! 🎴</h1>
  <div id="stars"></div>
  <div id="board"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const ANIMALS = [
      { e: '🐼', n: 'pandas' },  { e: '🦊', n: 'foxes' },
      { e: '🐸', n: 'frogs' },   { e: '🐙', n: 'octopuses' },
      { e: '🦁', n: 'lions' },   { e: '🐷', n: 'pigs' },
      { e: '🐨', n: 'koalas' },  { e: '🐵', n: 'monkeys' },
    ];
    const board = document.getElementById('board');
    const starsEl = document.getElementById('stars');

    let pairs = 2;            // grows 2 -> 3 -> 4
    let wins = 0;
    let first = null;         // first flipped card this turn
    let lock = false;
    let matchedCount = 0;

    function newRound() {
      board.innerHTML = '';
      first = null;
      lock = false;
      matchedCount = 0;

      const chosen = KidsUtil.shuffle(ANIMALS).slice(0, pairs);
      const deck = KidsUtil.shuffle([...chosen, ...chosen]);

      deck.forEach(animal => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.e = animal.e;
        card.dataset.n = animal.n;
        card.innerHTML = `
          <div class="inner">
            <div class="face front">⭐</div>
            <div class="face back">${animal.e}</div>
          </div>`;
        card.addEventListener('pointerdown', () => flip(card));
        board.appendChild(card);
      });
      KidsAudio.speak('Find the matching pairs!');
    }

    function flip(card) {
      if (lock || card.classList.contains('flipped')) return;
      KidsAudio.playPop();
      card.classList.add('flipped');

      if (!first) {
        first = card;
        return;
      }

      // Second card of the turn
      if (first.dataset.e === card.dataset.e) {
        first.classList.add('matched');
        card.classList.add('matched');
        KidsAudio.playChime('yay');
        KidsAudio.speak(`A pair! Two ${card.dataset.n}!`);
        matchedCount++;
        first = null;
        if (matchedCount === pairs) setTimeout(win, 900);
      } else {
        lock = true;
        const a = first, b = card;
        first = null;
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          lock = false;
        }, 1100);
      }
    }

    function win() {
      wins++;
      starsEl.textContent = '⭐'.repeat(((wins - 1) % 10) + 1);
      KidsAudio.playChime('yay');
      KidsAudio.speak('You found them all! Amazing!');
      confettiBurst();
      if (pairs < 4) pairs++;
      setTimeout(newRound, 2400);
    }

    function confettiBurst() {
      for (let i = 0; i < 28; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = KidsUtil.rand(['🎉', '⭐', '💜', '✨', '🎈']);
        c.style.left = Math.random() * 100 + 'vw';
        c.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2300);
      }
    }

    newRound();
  </script>
</body>
</html>
