<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Feelings Faces</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #ffe29f 0%, #ffa99f 50%, #ff719a 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  html[data-theme="dark"] body {
    background: linear-gradient(180deg, #2a2410 0%, #2a1a18 50%, #2a1320 100%);
  }
  #prompt {
    color: #fff;
    text-align: center;
    font-size: clamp(24px, 5.6vw, 44px);
    font-weight: 900;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.18);
    margin: 0;
    padding: 86px 16px 0;
    min-height: 1.4em;
  }
  #prompt b {
    color: #fff;
    border-bottom: 5px solid rgba(255,255,255,0.75);
    padding-bottom: 1px;
  }
  #faces {
    flex: 1;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    align-content: center;
    justify-content: center;
    gap: clamp(14px, 4vw, 44px);
    padding: 16px;
    min-height: 0;
  }
  .face {
    width: clamp(108px, 26vw, 196px);
    height: clamp(108px, 26vw, 196px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(66px, 17vw, 128px);
    line-height: 1;
    box-shadow: 0 10px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    user-select: none;
    animation: bob 2.4s ease-in-out infinite;
  }
  .face:nth-child(2) { animation-delay: 0.4s; }
  .face:nth-child(3) { animation-delay: 0.8s; }
  .face:nth-child(4) { animation-delay: 1.2s; }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  .face:active { transform: scale(0.94); }
  .face.right { animation: cheer 0.7s ease forwards; }
  @keyframes cheer {
    0%   { transform: scale(1) rotate(0); }
    30%  { transform: scale(1.25) rotate(-7deg); }
    60%  { transform: scale(1.12) rotate(6deg); }
    100% { transform: scale(1.18) rotate(0); }
  }
  .face.wrong { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-12px); }
    75%     { transform: translateX(12px); }
  }
  #hint {
    color: #fff;
    font-weight: 700;
    font-size: clamp(13px, 3vw, 18px);
    opacity: 0.85;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    padding: 0 0 16px;
  }
  .confetti {
    position: fixed;
    font-size: 30px;
    pointer-events: none;
    z-index: 500;
    animation: fall 1.7s ease-in forwards;
  }
  @keyframes fall {
    from { transform: translateY(-40px) rotate(0);      opacity: 1; }
    to   { transform: translateY(105vh) rotate(380deg); opacity: 0.85; }
  }
</style>
</head>
<body>
  <h1 id="prompt">Find the happy face!</h1>
  <div id="faces"></div>
  <div id="hint">Tap the face that matches!</div>

  <script src="../../shared/common.js"></script>
  <script>
    const FEELINGS = [
      { key: 'happy',     emoji: '😀', word: 'Happy' },
      { key: 'sad',       emoji: '😢', word: 'Sad' },
      { key: 'angry',     emoji: '😠', word: 'Angry' },
      { key: 'scared',    emoji: '😨', word: 'Scared' },
      { key: 'sleepy',    emoji: '😴', word: 'Sleepy' },
      { key: 'surprised', emoji: '😮', word: 'Surprised' },
      { key: 'silly',     emoji: '😝', word: 'Silly' },
    ];
    const PASTELS = ['#fff3b0','#cdeffd','#ffd6e0','#d7f9e0','#e7d9ff','#ffe0c2'];

    const facesEl = document.getElementById('faces');
    const promptEl = document.getElementById('prompt');
    let target = null;
    let locked = false;

    function newRound() {
      locked = false;
      facesEl.innerHTML = '';
      const choices = KidsUtil.shuffle(FEELINGS).slice(0, 3);
      target = KidsUtil.rand(choices);
      promptEl.innerHTML = `Find the <b>${target.word.toLowerCase()}</b> face!`;

      const colors = KidsUtil.shuffle(PASTELS);
      choices.forEach((f, i) => {
        const d = document.createElement('div');
        d.className = 'face';
        d.textContent = f.emoji;
        d.style.background = colors[i % colors.length];
        d.addEventListener('pointerdown', () => choose(f, d));
        facesEl.appendChild(d);
      });
      KidsAudio.speak(`Find the ${target.word} face.`);
    }

    function choose(f, d) {
      if (locked) return;
      try { KidsAudio.getAudio(); } catch (e) {}
      if (f.key === target.key) {
        locked = true;
        d.classList.add('right');
        promptEl.innerHTML = `Yes! <b>${target.word}!</b>`;
        KidsAudio.playChime('yay');
        KidsAudio.speak(`Yes! That's ${target.word}!`);
        confettiBurst();
        setTimeout(newRound, 2000);
      } else {
        d.classList.add('wrong');
        KidsAudio.playChime('uhoh');
        KidsAudio.speak('Try again.');
        setTimeout(() => d.classList.remove('wrong'), 450);
      }
    }

    function confettiBurst() {
      for (let i = 0; i < 26; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = KidsUtil.rand(['🎉','⭐','💖','✨','🌈','😀']);
        c.style.left = Math.random() * 100 + 'vw';
        c.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2300);
      }
    }

    newRound();
  </script>
</body>
</html>
