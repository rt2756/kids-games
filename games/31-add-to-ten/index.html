<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Add to 10</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #56ab2f 0%, #a8e063 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #14310a 0%, #1e3a10 100%); }
  h1 { color:#1d3a00; font-weight:900; font-size:clamp(22px,5vw,36px); margin:0; padding:84px 16px 4px; }
  html[data-theme="dark"] h1 { color:#d4f5b0; }
  #objs { display:flex; align-items:center; gap:clamp(8px,3vw,22px); flex-wrap:wrap; justify-content:center; padding:8px 12px; }
  .grp { display:flex; flex-wrap:wrap; gap:4px; max-width:42vw; justify-content:center; }
  .obj { font-size:clamp(26px,7vw,46px); line-height:1; animation:pop .3s ease; }
  @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
  .plus, .eq { font-size:clamp(34px,8vw,58px); font-weight:900; color:#1d3a00; }
  html[data-theme="dark"] .plus, html[data-theme="dark"] .eq { color:#d4f5b0; }
  #q { color:#1d3a00; font-weight:900; font-size:clamp(28px,8vw,52px); margin:6px 0; }
  html[data-theme="dark"] #q { color:#fff; }
  #choices { display:flex; gap:clamp(12px,4vw,26px); padding:10px 0 20px; flex-wrap:wrap; justify-content:center; }
  .choice {
    width:clamp(72px,18vw,108px); height:clamp(72px,18vw,108px); border-radius:22px; background:#fff;
    color:#2d7a00; font-weight:900; font-size:clamp(34px,9vw,54px); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.18); transition:transform .08s;
  }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .4s; }
  .choice.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#1d3a00; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#d4f5b0; }
  .confetti { position:fixed; font-size:28px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>How many in all?</h1>
  <div id="objs"></div>
  <div id="q"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const ICONS = ['🍎','🍌','⭐','🐟','🎈','🍓','🚗','🐥'];
    const objsEl = document.getElementById('objs');
    const qEl = document.getElementById('q');
    const choicesEl = document.getElementById('choices');
    const scoreEl = document.getElementById('score');
    let answer, score = 0, locked = false;

    function grp(n, icon) {
      const g = document.createElement('div'); g.className = 'grp';
      for (let i=0;i<n;i++){ const o=document.createElement('span'); o.className='obj'; o.textContent=icon; o.style.animationDelay=(i*0.05)+'s'; g.appendChild(o); }
      return g;
    }

    function newRound() {
      locked = false;
      const a = 1 + Math.floor(Math.random()*5);
      const b = 1 + Math.floor(Math.random()*(Math.min(5, 10-a)));
      answer = a + b;
      const icon = KidsUtil.rand(ICONS);
      objsEl.innerHTML = '';
      objsEl.appendChild(grp(a, icon));
      const plus = document.createElement('span'); plus.className='plus'; plus.textContent='+'; objsEl.appendChild(plus);
      objsEl.appendChild(grp(b, icon));
      qEl.textContent = `${a} + ${b} = ?`;

      const opts = new Set([answer]);
      while (opts.size < 3) { let d = answer + (Math.floor(Math.random()*5)-2); if (d>=1 && d<=10) opts.add(d); }
      choicesEl.innerHTML = '';
      KidsUtil.shuffle([...opts]).forEach(n => {
        const c = document.createElement('div'); c.className='choice'; c.textContent=n;
        c.onclick = () => pick(n, c); choicesEl.appendChild(c);
      });
      KidsAudio.speak(`${a} plus ${b}. How many in all?`);
    }

    function pick(n, c) {
      if (locked) return;
      try { KidsAudio.getAudio(); } catch(e) {}
      if (n === answer) {
        locked = true; c.classList.add('right');
        score++; scoreEl.textContent = '⭐ ' + score;
        KidsAudio.playChime('yay');
        KidsAudio.speak(`Yes! It is ${answer}!`);
        confetti();
        setTimeout(newRound, 1800);
      } else {
        c.classList.add('wrong'); KidsAudio.playChime('uhoh'); KidsAudio.speak('Count again.');
        setTimeout(() => c.classList.remove('wrong'), 450);
      }
    }

    function confetti() {
      for (let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
        c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw';
        c.style.animationDelay=(Math.random()*0.4)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),2100); }
    }
    newRound();
  </script>
</body>
</html>
