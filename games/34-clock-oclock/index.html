<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>What's the Time?</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #ee9ca7 0%, #ffdde1 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #3a1f24 0%, #2a1c1e 100%); }
  h1 { color:#a83246; font-weight:900; font-size:clamp(22px,5vw,36px); margin:0; padding:84px 16px 6px; }
  html[data-theme="dark"] h1 { color:#ffd0d8; }
  svg { width:min(66vw,280px); height:min(66vw,280px); margin:6px 0; }
  .face { fill:#fff; stroke:#a83246; stroke-width:5; }
  html[data-theme="dark"] .face { fill:#2a2a2a; stroke:#ff97a8; }
  .tnum { fill:#a83246; font-weight:900; font-size:18px; font-family:system-ui,sans-serif; }
  html[data-theme="dark"] .tnum { fill:#ffd0d8; }
  .hand { stroke:#a83246; stroke-linecap:round; }
  html[data-theme="dark"] .hand { stroke:#ff97a8; }
  .pivot { fill:#a83246; }
  html[data-theme="dark"] .pivot { fill:#ff97a8; }
  #choices { display:flex; gap:clamp(10px,4vw,22px); flex-wrap:wrap; justify-content:center; padding:8px 10px 20px; }
  .choice { border:none; background:#fff; color:#a83246; font-weight:900; font-size:clamp(16px,4vw,24px);
    padding:14px 20px; border-radius:18px; cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.16); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .4s; }
  .choice.right { background:#b6f09c; color:#2d7a00; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#a83246; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#ffd0d8; }
  .confetti { position:fixed; font-size:28px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>What's the time?</h1>
  <svg id="clock" viewBox="0 0 200 200"></svg>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const clock = document.getElementById('clock');
    const choicesEl = document.getElementById('choices');
    const scoreEl = document.getElementById('score');
    let hour, score = 0, locked = false;
    const SVGNS = 'http://www.w3.org/2000/svg';

    function el(name, attrs) { const n=document.createElementNS(SVGNS,name); for(const k in attrs) n.setAttribute(k,attrs[k]); return n; }
    function pt(angle, len) { const r=(angle-90)*Math.PI/180; return [100+len*Math.cos(r), 100+len*Math.sin(r)]; }

    function drawClock(h) {
      clock.innerHTML = '';
      clock.appendChild(el('circle', { class:'face', cx:100, cy:100, r:92 }));
      for (let n=1;n<=12;n++){
        const [x,y]=pt(n*30, 74);
        const t=el('text',{ class:'tnum', x, y, 'text-anchor':'middle', 'dominant-baseline':'central' });
        t.textContent=n; clock.appendChild(t);
      }
      // minute hand straight up to 12
      let [mx,my]=pt(0,66); clock.appendChild(el('line',{ class:'hand', x1:100,y1:100,x2:mx,y2:my, 'stroke-width':4 }));
      // hour hand
      let [hx,hy]=pt(h*30,46); clock.appendChild(el('line',{ class:'hand', x1:100,y1:100,x2:hx,y2:hy, 'stroke-width':7 }));
      clock.appendChild(el('circle',{ class:'pivot', cx:100,cy:100,r:7 }));
    }

    function newRound() {
      locked = false;
      hour = 1 + Math.floor(Math.random()*12);
      drawClock(hour);
      const opts = new Set([hour]);
      while (opts.size < 3) opts.add(1 + Math.floor(Math.random()*12));
      choicesEl.innerHTML = '';
      KidsUtil.shuffle([...opts]).forEach(h => {
        const b = document.createElement('button');
        b.className = 'choice'; b.textContent = h + " o'clock";
        b.onclick = () => pick(h, b); choicesEl.appendChild(b);
      });
      KidsAudio.speak("What's the time?");
    }

    function pick(h, b) {
      if (locked) return;
      try { KidsAudio.getAudio(); } catch(e) {}
      if (h === hour) {
        locked = true; b.classList.add('right');
        score++; scoreEl.textContent = '⭐ ' + score;
        KidsAudio.playChime('yay');
        KidsAudio.speak("Yes! It's " + hour + " o'clock!");
        confetti();
        setTimeout(newRound, 2000);
      } else {
        b.classList.add('wrong'); KidsAudio.playChime('uhoh'); KidsAudio.speak('Look at the short hand.');
        setTimeout(() => b.classList.remove('wrong'), 450);
      }
    }

    function confetti() {
      for (let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
        c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw';
        c.style.animationDelay=(Math.random()*0.4)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),2100); }
    }
    newRound();
  </script>
</body>
</html>
