<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Quick Math</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #ff512f 0%, #f09819 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #3a160c 0%, #3a2608 100%); }
  h1 { color:#fff; font-weight:900; font-size:clamp(18px,4.4vw,28px); margin:0; padding:80px 16px 0; text-shadow:2px 2px 0 rgba(0,0,0,.18); }
  #stats { display:flex; gap:18px; color:#fff; font-weight:900; font-size:clamp(14px,3.4vw,18px); margin:6px 0; }
  #bar { width:min(80vw,420px); height:14px; border-radius:999px; background:rgba(255,255,255,.3); overflow:hidden; margin:4px 0 2px; }
  #fill { height:100%; width:100%; background:#fff; border-radius:999px; transition:width .1s linear; }
  #q { color:#fff; font-weight:900; font-size:clamp(40px,12vw,76px); margin:10px 0; text-shadow:2px 2px 0 rgba(0,0,0,.18); }
  #choices { display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,3vw,18px); padding:6px 12px 20px; }
  .choice { width:clamp(110px,32vw,180px); height:clamp(64px,15vw,90px); border:none; border-radius:18px; background:#fff;
    color:#d84315; font-weight:900; font-size:clamp(28px,7vw,44px); cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.18); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; background:#ffd2c2; }
  .choice.right { background:#b6f09c; color:#2d7a00; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #msg { color:#fff; font-weight:800; min-height:24px; font-size:clamp(14px,3.4vw,20px); }
</style>
</head>
<body>
  <h1>⚡ Quick Math — answer fast!</h1>
  <div id="stats"><span id="score">Score 0</span><span id="streak">🔥 0</span><span id="best">Best 0</span></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="q"></div>
  <div id="choices"></div>
  <div id="msg"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const qEl=document.getElementById('q'), choicesEl=document.getElementById('choices'),
      fill=document.getElementById('fill'), msg=document.getElementById('msg'),
      scoreEl=document.getElementById('score'), streakEl=document.getElementById('streak'), bestEl=document.getElementById('best');
    let answer, score=0, streak=0, best=0, locked=false, timer=null, timeLeft=0;
    const LIMIT=6000;

    function newRound() {
      locked=false; msg.textContent='';
      const sub = Math.random()<0.5;
      let a,b;
      if (sub){ a=2+Math.floor(Math.random()*18); b=1+Math.floor(Math.random()*a); answer=a-b; qEl.textContent=`${a} − ${b}`; }
      else { a=1+Math.floor(Math.random()*15); b=1+Math.floor(Math.random()*(20-a)); answer=a+b; qEl.textContent=`${a} + ${b}`; }
      const opts=new Set([answer]);
      while(opts.size<4){ let d=answer+(Math.floor(Math.random()*7)-3); if(d>=0&&d<=20) opts.add(d); }
      choicesEl.innerHTML='';
      KidsUtil.shuffle([...opts]).forEach(n=>{ const c=document.createElement('button'); c.className='choice'; c.textContent=n; c.onclick=()=>pick(n,c); choicesEl.appendChild(c); });
      startTimer();
    }

    function startTimer() {
      timeLeft=LIMIT; fill.style.width='100%';
      clearInterval(timer);
      const t0=Date.now();
      timer=setInterval(()=>{
        timeLeft=LIMIT-(Date.now()-t0);
        fill.style.width=Math.max(0,timeLeft/LIMIT*100)+'%';
        if(timeLeft<=0){ clearInterval(timer); timeUp(); }
      },80);
    }

    function pick(n,c) {
      if(locked) return; locked=true; clearInterval(timer);
      try{KidsAudio.getAudio();}catch(e){}
      if(n===answer){ c.classList.add('right'); score++; streak++; best=Math.max(best,streak);
        scoreEl.textContent='Score '+score; streakEl.textContent='🔥 '+streak; bestEl.textContent='Best '+best;
        KidsAudio.playChime('yay'); if(streak>0&&streak%5===0) KidsAudio.speak(streak+' in a row!');
        setTimeout(newRound,650);
      } else { c.classList.add('wrong'); streak=0; streakEl.textContent='🔥 0';
        KidsAudio.playChime('uhoh'); msg.textContent='It was '+answer; KidsAudio.speak('It was '+answer);
        [...choicesEl.children].forEach(b=>{ if(+b.textContent===answer) b.classList.add('right'); });
        setTimeout(newRound,1300);
      }
    }

    function timeUp() {
      if(locked) return; locked=true; streak=0; streakEl.textContent='🔥 0';
      msg.textContent='Too slow — it was '+answer; KidsAudio.playChime('uhoh');
      [...choicesEl.children].forEach(b=>{ if(+b.textContent===answer) b.classList.add('right'); });
      setTimeout(newRound,1300);
    }
    newRound();
  </script>
</body>
</html>
