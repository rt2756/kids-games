<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Money Market</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body {
    background: linear-gradient(180deg, #f12711 0%, #f5af19 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center;
  }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #3a0e06 0%, #3a2906 100%); }
  h1 { color:#fff; font-weight:900; font-size:clamp(18px,4.4vw,28px); margin:0; padding:80px 16px 2px; text-shadow:2px 2px 0 rgba(0,0,0,.18); }
  #item { display:flex; flex-direction:column; align-items:center; background:rgba(255,255,255,.18); border-radius:20px; padding:10px 24px; margin:6px; }
  #emoji { font-size:clamp(56px,16vw,100px); line-height:1; }
  #price { color:#fff; font-weight:900; font-size:clamp(22px,6vw,38px); }
  #total { color:#fff; font-weight:900; font-size:clamp(20px,5vw,30px); margin:4px 0; }
  #total.match { color:#b6f09c; }
  #total.over { color:#ffd2c2; }
  #coins { display:flex; gap:clamp(8px,3vw,18px); flex-wrap:wrap; justify-content:center; padding:8px; }
  .coin { width:clamp(64px,17vw,94px); height:clamp(64px,17vw,94px); border-radius:50%; border:4px solid rgba(0,0,0,.15);
    background:radial-gradient(circle at 35% 30%, #ffe57a, #d4a017); color:#5a3d00; font-weight:900; font-size:clamp(18px,4.6vw,26px);
    cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.2); transition:transform .08s; font-family:inherit; }
  .coin:active { transform:translateY(3px); }
  #ctrl { display:flex; gap:12px; margin-top:6px; }
  .ctrl { border:none; border-radius:999px; padding:10px 20px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;
    background:rgba(255,255,255,.92); color:#c0560a; }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#fff; font-weight:900; font-size:18px; }
  .confetti { position:fixed; font-size:28px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>Pay the exact price!</h1>
  <div id="item"><div id="emoji"></div><div id="price"></div></div>
  <div id="total">You have ₹0</div>
  <div id="coins"></div>
  <div id="ctrl"><button class="ctrl" id="reset">↺ Start over</button></div>

  <script src="../../shared/common.js"></script>
  <script>
    const ITEMS=[['🍎',null],['🍌',null],['🍭',null],['✏️',null],['🧃',null],['🍪',null],['🎈',null],['🚗',null]];
    const COINS=[1,2,5,10];
    const emojiEl=document.getElementById('emoji'), priceEl=document.getElementById('price'),
      totalEl=document.getElementById('total'), coinsEl=document.getElementById('coins'), scoreEl=document.getElementById('score');
    let price, total, score=0, locked=false;

    function newRound(){
      locked=false; total=0;
      price=3+Math.floor(Math.random()*16); // 3..18
      const item=KidsUtil.rand(ITEMS);
      emojiEl.textContent=item[0];
      priceEl.textContent='₹'+price;
      updateTotal();
      coinsEl.innerHTML='';
      COINS.forEach(v=>{ const b=document.createElement('button'); b.className='coin'; b.textContent='₹'+v; b.onclick=()=>add(v); coinsEl.appendChild(b); });
      KidsAudio.speak('Pay ' + price + ' rupees.');
    }

    function updateTotal(){ totalEl.textContent='You have ₹'+total; totalEl.className=''; }

    function add(v){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(e){}
      total+=v; updateTotal();
      KidsAudio.playPop();
      if(total===price){ locked=true; totalEl.classList.add('match'); score++; scoreEl.textContent='⭐ '+score;
        KidsAudio.playChime('yay'); KidsAudio.speak('Sold! Exactly ' + price + ' rupees!'); confetti(); setTimeout(newRound,2100);
      } else if(total>price){ totalEl.classList.add('over'); KidsAudio.playChime('uhoh'); KidsAudio.speak('Too much! Start over.'); }
      else { KidsAudio.speak('₹'+total); }
    }

    document.getElementById('reset').onclick=()=>{ if(locked) return; total=0; updateTotal(); KidsAudio.speak('Start over.'); };
    function confetti(){ for(let i=0;i<24;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','💰','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
