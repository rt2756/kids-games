<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Word Wizard</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #8e2de2 0%, #4a00e0 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #2a0d44 0%, #160048 100%); }
  h1 { color:#e3c6ff; font-weight:900; font-size:clamp(18px,4.2vw,26px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; }
  #task { color:#fff; font-weight:800; font-size:clamp(18px,5vw,28px); margin:6px; text-align:center; }
  #word { color:#fff; font-weight:900; font-size:clamp(42px,13vw,80px); margin:6px 0 14px; text-shadow:2px 2px 0 rgba(0,0,0,.25); }
  #choices { display:flex; flex-direction:column; gap:12px; width:min(86vw,420px); padding:0 12px; }
  .choice { border:none; border-radius:16px; background:#fff; color:#5a17b5; font-weight:900; font-size:clamp(20px,5.4vw,30px);
    padding:16px; cursor:pointer; box-shadow:0 7px 0 rgba(0,0,0,.25); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; background:#e9d2ff; }
  .choice.right { background:#b6f09c; color:#2d7a00; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#e3c6ff; font-weight:900; font-size:18px; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>🧙 Word Wizard</h1>
  <div id="task"></div>
  <div id="word"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const DATA=[
      {w:'happy',syn:'glad',ant:'sad'},{w:'big',syn:'large',ant:'small'},{w:'fast',syn:'quick',ant:'slow'},
      {w:'hot',syn:'warm',ant:'cold'},{w:'high',syn:'tall',ant:'low'},{w:'loud',syn:'noisy',ant:'quiet'},
      {w:'clean',syn:'tidy',ant:'dirty'},{w:'hard',syn:'tough',ant:'soft'},{w:'dark',syn:'dim',ant:'bright'},
      {w:'old',syn:'aged',ant:'new'},{w:'funny',syn:'silly',ant:'serious'},{w:'brave',syn:'bold',ant:'scared'},
    ];
    const POOL=['glad','large','quick','warm','tall','noisy','tidy','tough','dim','aged','silly','bold','sad','small','slow','cold','low','quiet','dirty','soft','bright','new','serious','scared','round','green','heavy','sweet'];
    const taskEl=document.getElementById('task'), wordEl=document.getElementById('word'), choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let answer, score=0, locked=false;

    function newRound(){
      locked=false;
      const e=KidsUtil.rand(DATA);
      const same=Math.random()<0.5;
      answer=same?e.syn:e.ant;
      taskEl.textContent=same?'Pick the word that means the SAME':'Pick the word that means the OPPOSITE';
      wordEl.textContent=e.w;
      const opts=new Set([answer]);
      while(opts.size<3){ const d=KidsUtil.rand(POOL); if(d!==e.w && d!==e.syn && d!==e.ant) opts.add(d); }
      choicesEl.innerHTML='';
      KidsUtil.shuffle([...opts]).forEach(o=>{ const b=document.createElement('button'); b.className='choice'; b.textContent=o; b.onclick=()=>pick(o,b); choicesEl.appendChild(b); });
      KidsAudio.speak((same?'Same as ':'Opposite of ')+e.w);
    }

    function pick(o,b){
      if(locked) return; locked=true; try{KidsAudio.getAudio();}catch(e){}
      if(o===answer){ b.classList.add('right'); score++; scoreEl.textContent='⭐ '+score;
        KidsAudio.playChime('yay'); KidsAudio.speak('Yes! '+answer); confetti(); setTimeout(newRound,1700);
      } else { b.classList.add('wrong'); KidsAudio.playChime('uhoh');
        [...choicesEl.children].forEach(x=>{ if(x.textContent===answer) x.classList.add('right'); });
        KidsAudio.speak('It is '+answer); setTimeout(newRound,2000); }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🪄','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
