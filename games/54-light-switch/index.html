<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Light Switch</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:background .4s ease; }
  body.on  { background:linear-gradient(180deg,#fff6c9 0%, #ffe17a 100%); }
  body.off { background:linear-gradient(180deg,#0b1026 0%, #1c2350 100%); }
  #sky { font-size:clamp(80px,26vw,180px); line-height:1; transition:transform .4s ease; }
  #label { font-weight:900; font-size:clamp(28px,9vw,60px); margin:6px 0 18px; transition:color .3s; }
  body.on  #label { color:#a8740a; }
  body.off #label { color:#cfd6ff; }
  #switch { width:clamp(110px,30vw,160px); height:clamp(160px,42vw,220px); border-radius:24px; cursor:pointer; position:relative;
    box-shadow:0 10px 0 rgba(0,0,0,.3); border:none; }
  body.on  #switch { background:#e8e8e8; }
  body.off #switch { background:#3a3f5a; }
  #lever { position:absolute; left:8%; right:8%; height:46%; border-radius:16px; transition:top .18s ease, background .3s; }
  body.on  #lever { top:6%;  background:linear-gradient(180deg,#fff,#cfcfcf); }
  body.off #lever { top:48%; background:linear-gradient(180deg,#6b7196,#474d6e); }
  #hint { position:fixed; bottom:24px; left:0; right:0; text-align:center; font-weight:800; font-size:clamp(14px,3.6vw,20px); opacity:.8; }
  body.on  #hint { color:#a8740a; } body.off #hint { color:#cfd6ff; }
</style>
</head>
<body class="on">
  <div id="sky">☀️</div>
  <div id="label">ON</div>
  <button id="switch"><span id="lever"></span></button>
  <div id="hint">Tap the switch!</div>

  <script src="../../shared/common.js"></script>
  <script>
    const sky=document.getElementById('sky'), label=document.getElementById('label');
    let on=true;
    function toggle(){
      try{KidsAudio.getAudio();}catch(e){}
      on=!on;
      document.body.classList.toggle('on', on);
      document.body.classList.toggle('off', !on);
      sky.textContent = on ? '☀️' : '🌙';
      label.textContent = on ? 'ON' : 'OFF';
      KidsAudio.playPop();
      KidsAudio.speak(on ? 'Lights on! Day time!' : 'Lights off! Night time!', { pitch:1.3 });
    }
    document.getElementById('switch').addEventListener('pointerdown', toggle);
  </script>
</body>
</html>
