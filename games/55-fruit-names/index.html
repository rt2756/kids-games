<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Fruit Names</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #f9f586 0%, #96fbc4 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #2e2e10 0%, #103a28 100%); }
  h1 { color:#2a6b3a; font-weight:900; font-size:clamp(16px,4vw,24px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; }
  html[data-theme="dark"] h1 { color:#bff5d4; }
  #fruit { font-size:clamp(120px,40vw,260px); line-height:1; cursor:pointer; user-select:none; transition:transform .12s; }
  #fruit:active { transform:scale(.9); }
  #name { color:#1c5b2c; font-weight:900; font-size:clamp(34px,10vw,64px); margin:6px 0 18px; text-transform:capitalize; }
  html[data-theme="dark"] #name { color:#fff; }
  #nav { display:flex; gap:18px; }
  .nav { width:clamp(64px,16vw,84px); height:clamp(64px,16vw,84px); border:none; border-radius:50%; background:#fff; color:#1c8b45;
    font-weight:900; font-size:clamp(28px,7vw,40px); cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.2); }
  .nav:active { transform:translateY(3px); }
</style>
</head>
<body>
  <h1>Tap the fruit to hear its name 🍓</h1>
  <div id="fruit"></div>
  <div id="name"></div>
  <div id="nav">
    <button class="nav" id="prev">◀</button>
    <button class="nav" id="next">▶</button>
  </div>

  <script src="../../shared/common.js"></script>
  <script>
    const FRUITS=[['apple','🍎'],['banana','🍌'],['grapes','🍇'],['orange','🍊'],['strawberry','🍓'],
      ['watermelon','🍉'],['mango','🥭'],['cherry','🍒'],['pineapple','🍍'],['peach','🍑'],['lemon','🍋'],['pear','🍐']];
    const fruitEl=document.getElementById('fruit'), nameEl=document.getElementById('name');
    let i=0;
    function show(speak){
      const [name,emoji]=FRUITS[i];
      fruitEl.textContent=emoji; nameEl.textContent=name;
      if(speak){ try{KidsAudio.getAudio();}catch(e){} KidsAudio.speak(name, { pitch:1.25 }); }
    }
    fruitEl.onclick=()=>{ try{KidsAudio.getAudio();}catch(e){} KidsAudio.playPop(); KidsAudio.speak(FRUITS[i][0], { pitch:1.25 }); };
    document.getElementById('next').onclick=()=>{ i=(i+1)%FRUITS.length; show(true); };
    document.getElementById('prev').onclick=()=>{ i=(i-1+FRUITS.length)%FRUITS.length; show(true); };
    show(false);
  </script>
</body>
</html>
