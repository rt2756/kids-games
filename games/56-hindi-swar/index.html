<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Hindi Swar — हिंदी स्वर</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #ff9966 0%, #ff5e62 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #3a2014 0%, #3a1618 100%); }
  h1 { color:#fff; font-weight:900; font-size:clamp(16px,4vw,24px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; text-shadow:1px 1px 0 rgba(0,0,0,.2); }
  #letter { font-size:clamp(120px,38vw,240px); line-height:1; color:#fff; cursor:pointer; user-select:none; text-shadow:3px 3px 0 rgba(0,0,0,.18); transition:transform .12s; }
  #letter:active { transform:scale(.92); }
  #sound { color:#fff; font-weight:900; font-size:clamp(20px,5vw,30px); opacity:.95; }
  #word { color:#fff; font-weight:800; font-size:clamp(24px,6vw,40px); margin:2px 0 4px; }
  #ex { font-size:clamp(40px,11vw,72px); line-height:1; min-height:1em; }
  #nav { display:flex; gap:18px; margin-top:10px; }
  .nav { width:clamp(64px,16vw,84px); height:clamp(64px,16vw,84px); border:none; border-radius:50%; background:#fff; color:#e8590c;
    font-weight:900; font-size:clamp(28px,7vw,40px); cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.2); }
  .nav:active { transform:translateY(3px); }
</style>
</head>
<body>
  <h1>तप करो — सुनो! Tap to hear the Hindi vowel</h1>
  <div id="letter"></div>
  <div id="sound"></div>
  <div id="ex"></div>
  <div id="word"></div>
  <div id="nav">
    <button class="nav" id="prev">◀</button>
    <button class="nav" id="next">▶</button>
  </div>

  <script src="../../shared/common.js"></script>
  <script>
    // NCERT Sarangi (Class 1) — स्वर (vowels)
    const SWAR = [
      { l:'अ',  s:'a',  w:'अनार',  t:'anaar',  e:'' },
      { l:'आ',  s:'aa', w:'आम',    t:'aam',    e:'🥭' },
      { l:'इ',  s:'i',  w:'इमली',  t:'imli',   e:'' },
      { l:'ई',  s:'ee', w:'ईंट',   t:'eent',   e:'🧱' },
      { l:'उ',  s:'u',  w:'उल्लू', t:'ullu',   e:'🦉' },
      { l:'ऊ',  s:'oo', w:'ऊन',    t:'oon',    e:'🧶' },
      { l:'ए',  s:'e',  w:'एड़ी',  t:'edi',    e:'🦶' },
      { l:'ऐ',  s:'ai', w:'ऐनक',   t:'ainak',  e:'👓' },
      { l:'ओ',  s:'o',  w:'ओखली',  t:'okhli',  e:'' },
      { l:'औ',  s:'au', w:'औरत',   t:'aurat',  e:'👩' },
      { l:'अं', s:'an', w:'अंगूर', t:'angoor', e:'🍇' },
    ];
    const letterEl=document.getElementById('letter'), soundEl=document.getElementById('sound'),
      wordEl=document.getElementById('word'), exEl=document.getElementById('ex');
    let i=0;

    function hindiVoice(){ if(!('speechSynthesis'in window)) return null; const vs=speechSynthesis.getVoices()||[]; return vs.find(v=>/hi[-_]?in|hindi|lekha|kiran/i.test((v.lang||'')+(v.name||''))) || null; }
    function sayHi(text){ if(!('speechSynthesis'in window)) return; try{speechSynthesis.cancel();}catch(e){} const u=new SpeechSynthesisUtterance(text); u.lang='hi-IN'; const v=hindiVoice(); if(v) u.voice=v; u.rate=0.8; u.pitch=1.1; speechSynthesis.speak(u); }
    if('speechSynthesis'in window){ speechSynthesis.getVoices(); speechSynthesis.addEventListener('voiceschanged',()=>speechSynthesis.getVoices()); }

    function show(speak){
      const d=SWAR[i];
      letterEl.textContent=d.l; soundEl.textContent='"'+d.s+'"'; exEl.textContent=d.e||''; wordEl.textContent=d.w+' ('+d.t+')';
      if(speak){ sayHi(d.l + '. ' + d.w + '.'); }
    }
    letterEl.onclick=()=>{ try{KidsAudio.getAudio();}catch(e){} KidsAudio.playPop(); sayHi(SWAR[i].l+'. '+SWAR[i].w+'.'); };
    document.getElementById('next').onclick=()=>{ i=(i+1)%SWAR.length; show(true); };
    document.getElementById('prev').onclick=()=>{ i=(i-1+SWAR.length)%SWAR.length; show(true); };
    show(false);
  </script>
</body>
</html>
