<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Five Senses</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #fbc2eb 0%, #a6c1ee 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #3a223a 0%, #1c2640 100%); }
  h1 { color:#6a2c6a; font-weight:900; font-size:clamp(20px,5vw,32px); margin:0; padding:84px 16px 4px; text-align:center; }
  html[data-theme="dark"] h1 { color:#f3d0ff; }
  #cue { font-size:clamp(80px,24vw,150px); line-height:1; margin:6px 0; }
  #q { color:#6a2c6a; font-weight:800; font-size:clamp(18px,4.6vw,26px); margin-bottom:6px; text-align:center; padding:0 12px; }
  html[data-theme="dark"] #q { color:#f3d0ff; }
  #choices { display:flex; gap:clamp(12px,4vw,26px); flex-wrap:wrap; justify-content:center; padding:6px 10px 20px; }
  .choice { display:flex; flex-direction:column; align-items:center; gap:4px; width:clamp(96px,26vw,140px); padding:12px 6px;
    border-radius:22px; background:#fff; cursor:pointer; box-shadow:0 8px 0 rgba(0,0,0,.16); transition:transform .08s; }
  .choice .ce { font-size:clamp(46px,12vw,76px); line-height:1; }
  .choice .cl { font-weight:900; color:#8e3a8e; font-size:clamp(14px,3.4vw,18px); }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .4s; }
  .choice.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#6a2c6a; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#f3d0ff; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>Our Five Senses</h1>
  <div id="cue"></div>
  <div id="q"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const SENSES=[
      { act:'see',   verb:'see',   org:'👀', orgn:'eyes',  cue:'🌈' },
      { act:'hear',  verb:'hear',  org:'👂', orgn:'ears',  cue:'🔔' },
      { act:'smell', verb:'smell', org:'👃', orgn:'nose',  cue:'🌸' },
      { act:'taste', verb:'taste', org:'👅', orgn:'tongue',cue:'🍦' },
      { act:'touch', verb:'touch', org:'✋', orgn:'hands', cue:'🧸' },
    ];
    const cueEl=document.getElementById('cue'), qEl=document.getElementById('q'), choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let cur, score=0, locked=false;

    function newRound(){
      locked=false;
      cur=KidsUtil.rand(SENSES);
      cueEl.textContent=cur.cue; qEl.textContent='Which part do we '+cur.verb+' with?';
      const others=KidsUtil.shuffle(SENSES.filter(s=>s.orgn!==cur.orgn)).slice(0,2);
      choicesEl.innerHTML='';
      KidsUtil.shuffle([cur,...others]).forEach(s=>{
        const c=document.createElement('div'); c.className='choice';
        c.innerHTML='<span class="ce">'+s.org+'</span><span class="cl">'+s.orgn+'</span>';
        c.onclick=()=>pick(s,c); choicesEl.appendChild(c);
      });
      KidsAudio.speak('Which part do we '+cur.verb+' with?');
    }
    function pick(s,c){
      if(locked) return; locked=true; try{KidsAudio.getAudio();}catch(e){}
      if(s.orgn===cur.orgn){ c.classList.add('right'); score++; scoreEl.textContent='⭐ '+score;
        KidsAudio.playChime('yay'); KidsAudio.speak('Yes! We '+cur.verb+' with our '+cur.orgn+'!'); confetti(); setTimeout(newRound,2000);
      } else { c.classList.add('wrong'); locked=false; KidsAudio.playChime('uhoh'); KidsAudio.speak('Try again.'); setTimeout(()=>c.classList.remove('wrong'),450); }
    }
    function confetti(){ for(let i=0;i<20;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
