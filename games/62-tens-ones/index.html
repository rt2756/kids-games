<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Tens &amp; Ones</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #0e2a3e 0%, #07343a 100%); }
  h1 { color:#053a52; font-weight:900; font-size:clamp(18px,4.6vw,28px); margin:0; padding:82px 16px 2px; text-align:center; }
  html[data-theme="dark"] h1 { color:#bfeeff; }
  #target { color:#053a52; font-weight:900; font-size:clamp(30px,8vw,52px); margin:2px 0; }
  html[data-theme="dark"] #target { color:#fff; }
  #cols { display:flex; gap:18px; flex:1; min-height:0; align-items:stretch; padding:6px 8px; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .colhead { font-weight:900; color:#053a52; font-size:clamp(15px,3.6vw,20px); margin-bottom:4px; }
  html[data-theme="dark"] .colhead { color:#bfeeff; }
  .tray { width:clamp(120px,40vw,200px); flex:1; min-height:120px; background:rgba(255,255,255,.4); border-radius:14px;
    padding:8px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:5px; justify-content:center; }
  .rod { width:18px; height:64px; background:#1565c0; border-radius:4px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.3); }
  .unit { width:20px; height:20px; background:#ff7043; border-radius:4px; }
  #total { color:#053a52; font-weight:900; font-size:clamp(20px,5vw,30px); margin:2px 0; }
  html[data-theme="dark"] #total { color:#fff; }
  #total.match { color:#1b8a3a; }
  #btns { display:flex; gap:10px; padding-bottom:16px; flex-wrap:wrap; justify-content:center; }
  .btn { border:none; border-radius:14px; padding:12px 18px; font-weight:900; font-size:clamp(16px,4vw,20px); cursor:pointer; font-family:inherit;
    box-shadow:0 6px 0 rgba(0,0,0,.2); }
  .add10 { background:#1565c0; color:#fff; } .add1 { background:#ff7043; color:#fff; } .reset { background:#fff; color:#053a52; }
  .btn:active { transform:translateY(3px); }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#053a52; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#bfeeff; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>Build the number with tens and ones</h1>
  <div id="target"></div>
  <div id="cols">
    <div class="col"><div class="colhead">Tens (10)</div><div class="tray" id="tensTray"></div></div>
    <div class="col"><div class="colhead">Ones (1)</div><div class="tray" id="onesTray"></div></div>
  </div>
  <div id="total"></div>
  <div id="btns">
    <button class="btn add10" id="add10">+ 10</button>
    <button class="btn add1" id="add1">+ 1</button>
    <button class="btn reset" id="reset">↺</button>
  </div>

  <script src="../../shared/common.js"></script>
  <script>
    const targetEl=document.getElementById('target'), tensTray=document.getElementById('tensTray'), onesTray=document.getElementById('onesTray'),
      totalEl=document.getElementById('total'), scoreEl=document.getElementById('score');
    let target, tens, ones, score=0, locked=false;

    function newRound(){
      locked=false; tens=0; ones=0;
      target=11+Math.floor(Math.random()*38); // 11..48
      targetEl.textContent='Make '+target;
      draw();
      KidsAudio.speak('Make '+target+' using tens and ones.');
    }
    function draw(){
      tensTray.innerHTML=''; for(let i=0;i<tens;i++){ const d=document.createElement('div'); d.className='rod'; tensTray.appendChild(d); }
      onesTray.innerHTML=''; for(let i=0;i<ones;i++){ const d=document.createElement('div'); d.className='unit'; onesTray.appendChild(d); }
      const t=tens*10+ones;
      totalEl.textContent=tens+' ten'+(tens===1?'':'s')+' + '+ones+' one'+(ones===1?'':'s')+' = '+t;
      totalEl.className = t===target ? 'match' : '';
    }
    function check(){ if(tens*10+ones===target){ locked=true; score++; scoreEl.textContent='⭐ '+score; KidsAudio.playChime('yay'); KidsAudio.speak('Yes! '+target+'!'); confetti(); setTimeout(newRound,1900); } }
    document.getElementById('add10').onclick=()=>{ if(locked) return; try{KidsAudio.getAudio();}catch(e){} tens++; KidsAudio.playPop(); draw(); check(); };
    document.getElementById('add1').onclick=()=>{ if(locked) return; try{KidsAudio.getAudio();}catch(e){} ones++; KidsAudio.playPop(); draw(); check(); };
    document.getElementById('reset').onclick=()=>{ if(locked) return; tens=0; ones=0; draw(); };
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
