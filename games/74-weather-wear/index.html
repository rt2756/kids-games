<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Weather Wear</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #89f7fe 0%, #66a6ff 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #123a44 0%, #12234e 100%); }
  h1 { color:#0b3a6b; font-weight:900; font-size:clamp(18px,4.2vw,26px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; }
  html[data-theme="dark"] h1 { color:#bfe6ff; }
  #weather { font-size:clamp(80px,22vw,140px); line-height:1; }
  #caption { color:#0b3a6b; font-weight:900; font-size:clamp(20px,5.5vw,32px); margin:6px 0 10px; text-align:center; padding:0 12px; }
  html[data-theme="dark"] #caption { color:#fff; }
  #choices { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:10px 12px; }
  .choice { border:none; border-radius:18px; background:#fff; cursor:pointer;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 20px; }
  .choice .ce { font-size:clamp(44px,12vw,70px); line-height:1; }
  .choice .cw { font-size:clamp(13px,3.6vw,17px); font-weight:900; color:#0b3a6b; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; }
  .choice.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#0b3a6b; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#bfe6ff; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>What should we wear today?</h1>
  <div id="weather"></div>
  <div id="caption"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    // Each weather has right items; wrong choices come from other weathers.
    const WEATHER=[
      { e:'🌧️', say:"It's raining!", items:[['☂️','umbrella'],['🥾','rain boots'],['🧥','raincoat']] },
      { e:'☀️', say:"It's sunny and hot!", items:[['🕶️','sunglasses'],['🧢','cap'],['🩳','shorts']] },
      { e:'❄️', say:"It's snowing! Brrr!", items:[['🧤','warm gloves'],['🧣','cozy scarf'],['🧦','woolly socks']] },
      { e:'💨', say:"It's windy!", items:[['🧥','jacket'],['🪁','kite'],['🧢','cap']] },
    ];
    const weatherEl=document.getElementById('weather'), captionEl=document.getElementById('caption'),
      choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let answer, answerName, score=0, locked=false;

    function newRound(){
      locked=false; choicesEl.innerHTML='';
      const w=KidsUtil.rand(WEATHER);
      weatherEl.textContent=w.e; captionEl.textContent=w.say;
      const right=KidsUtil.rand(w.items);
      answer=right[0]; answerName=right[1];
      const opts=[right];
      while(opts.length<3){
        const other=KidsUtil.rand(WEATHER);
        if(other===w) continue;
        const item=KidsUtil.rand(other.items);
        // Skip items that would also work for this weather (e.g. cap for sun & wind)
        if(w.items.some(i=>i[0]===item[0]) || opts.some(o=>o[0]===item[0])) continue;
        opts.push(item);
      }
      KidsUtil.shuffle(opts).forEach(([e,name])=>{
        const b=document.createElement('button'); b.className='choice';
        b.innerHTML='<span class="ce">'+e+'</span><span class="cw">'+name+'</span>';
        b.onclick=()=>pick(e,name,b); choicesEl.appendChild(b);
      });
      KidsAudio.speak(w.say+' What should we wear?');
    }
    function pick(e,name,btn){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(err){}
      if(e===answer){
        locked=true; score++; scoreEl.textContent='⭐ '+score;
        btn.classList.add('right'); KidsAudio.playChime('yay');
        KidsAudio.speak('Yes! '+name.charAt(0).toUpperCase()+name.slice(1)+' — perfect for this weather!');
        confetti(); setTimeout(newRound,2100);
      } else {
        btn.classList.add('wrong'); KidsAudio.playChime('uhoh');
        KidsAudio.speak('Hmm, not for this weather. Try again!');
        setTimeout(()=>btn.classList.remove('wrong'),400);
      }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
