<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Take Away</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #ff758c 0%, #ff7eb3 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #4e1a26 0%, #4e1a38 100%); }
  h1 { color:#fff; font-weight:900; font-size:clamp(18px,4.2vw,26px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; text-shadow:1px 1px 0 rgba(0,0,0,.2); }
  #sum { color:#fff; font-weight:900; font-size:clamp(30px,8vw,52px); margin:0 0 8px; text-shadow:2px 2px 0 rgba(0,0,0,.2); }
  #items { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:min(92vw,480px); margin-bottom:14px; }
  .it { font-size:clamp(34px,9vw,52px); line-height:1; position:relative; transition:opacity .4s, transform .4s; }
  .it.gone { opacity:.25; transform:scale(.8); }
  .it.gone::after { content:'✖️'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.6em; }
  #choices { display:flex; gap:14px; justify-content:center; }
  .choice { border:none; border-radius:16px; background:#fff; color:#c2185b; font-weight:900; cursor:pointer;
    font-size:clamp(24px,7vw,36px); padding:14px 26px;
    box-shadow:0 7px 0 rgba(0,0,0,.2); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; }
  .choice.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#fff; font-weight:900; font-size:18px; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>How many are left?</h1>
  <div id="sum"></div>
  <div id="items"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const EMOJI=['🍎','🍪','🎈','⭐','🐟','🧁','🍓','🚗'];
    const sumEl=document.getElementById('sum'), itemsEl=document.getElementById('items'),
      choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let answer, score=0, locked=false;

    function newRound(){
      locked=false; choicesEl.innerHTML=''; itemsEl.innerHTML='';
      const a=4+Math.floor(Math.random()*7);      // 4..10
      const b=1+Math.floor(Math.random()*(a-1));  // 1..a-1
      answer=a-b;
      const emoji=KidsUtil.rand(EMOJI);
      sumEl.textContent=a+' − '+b+' = ?';
      for(let i=0;i<a;i++){ const d=document.createElement('div'); d.className='it'; d.textContent=emoji; itemsEl.appendChild(d); }
      // Cross out the taken-away ones one by one after a beat
      setTimeout(()=>{
        for(let i=0;i<b;i++){
          setTimeout(()=>{ itemsEl.children[a-1-i].classList.add('gone'); KidsAudio.playPop(); }, i*450);
        }
      },900);
      const opts=new Set([answer]);
      while(opts.size<3){ const d=Math.max(0,answer+Math.floor(Math.random()*5)-2); opts.add(d); }
      KidsUtil.shuffle([...opts]).forEach(n=>{
        const btn=document.createElement('button'); btn.className='choice'; btn.textContent=n;
        btn.onclick=()=>pick(n,btn); choicesEl.appendChild(btn);
      });
      KidsAudio.speak(a+' take away '+b+'. How many are left?');
    }
    function pick(n,btn){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(e){}
      if(n===answer){
        locked=true; score++; scoreEl.textContent='⭐ '+score;
        btn.classList.add('right'); KidsAudio.playChime('yay');
        KidsAudio.speak('Yes! '+answer+' left!');
        confetti(); setTimeout(newRound,2000);
      } else {
        btn.classList.add('wrong'); KidsAudio.playChime('uhoh');
        KidsAudio.speak('Count the ones without a cross!');
        setTimeout(()=>btn.classList.remove('wrong'),400);
      }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
