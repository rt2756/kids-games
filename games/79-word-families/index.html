<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Word Builder</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #84fab0 0%, #8fd3f4 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #123a24 0%, #123a4e 100%); }
  h1 { color:#0b5c3a; font-weight:900; font-size:clamp(18px,4.2vw,26px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; }
  html[data-theme="dark"] h1 { color:#c4ffe0; }
  #pic { font-size:clamp(70px,18vw,110px); line-height:1; }
  #word { display:flex; gap:8px; margin:14px 0 8px; align-items:center; }
  .letter { width:clamp(52px,14vw,76px); height:clamp(60px,16vw,88px); border-radius:14px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; color:#0b5c3a;
    font-size:clamp(34px,9vw,52px); text-transform:uppercase; box-shadow:0 6px 0 rgba(0,0,0,.15); }
  .letter.blank { background:rgba(255,255,255,.4); border:3px dashed rgba(0,0,0,.3); color:transparent; }
  .letter.filled { background:#ffe082; color:#0b5c3a; animation:popin .3s; }
  @keyframes popin { from{transform:scale(.5)} to{transform:scale(1)} }
  #choices { display:flex; gap:14px; justify-content:center; padding:16px 12px; }
  .choice { border:none; border-radius:16px; background:#fff; color:#0b5c3a; font-weight:900; cursor:pointer;
    font-size:clamp(28px,8vw,42px); width:clamp(64px,17vw,90px); height:clamp(64px,17vw,90px); text-transform:uppercase;
    box-shadow:0 7px 0 rgba(0,0,0,.18); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#0b5c3a; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#c4ffe0; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>Which letter finishes the word?</h1>
  <div id="pic"></div>
  <div id="word"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    // CVC-style words: [word, emoji]. First letter is the blank to fill.
    const WORDS=[
      ['cat','🐱'],['bat','🦇'],['hat','🎩'],['rat','🐀'],
      ['pan','🍳'],['fan','🪭'],['van','🚐'],['man','👨'],
      ['dog','🐶'],['log','🪵'],
      ['hen','🐔'],['pen','🖊️'],['ten','🔟'],
      ['bug','🐞'],['mug','☕'],['rug','🧶'],
      ['pig','🐷'],['wig','💇'],
      ['sun','☀️'],['bun','🥯'],
      ['bed','🛏️'],['red','🟥'],
      ['box','📦'],['fox','🦊'],
    ];
    const pic=document.getElementById('pic'), wordEl=document.getElementById('word'),
      choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let word, answer, score=0, locked=false;

    function newRound(){
      locked=false; choicesEl.innerHTML=''; wordEl.innerHTML='';
      const [w,e]=KidsUtil.rand(WORDS);
      word=w; answer=w[0]; pic.textContent=e;
      w.split('').forEach((ch,i)=>{
        const d=document.createElement('div');
        d.className='letter'+(i===0?' blank':''); d.textContent=ch;
        wordEl.appendChild(d);
      });
      const letters=new Set([answer]);
      const pool='bcdfghjklmnprstvw';
      while(letters.size<3) letters.add(pool[Math.floor(Math.random()*pool.length)]);
      KidsUtil.shuffle([...letters]).forEach(ch=>{
        const b=document.createElement('button'); b.className='choice'; b.textContent=ch;
        b.onclick=()=>pick(ch,b); choicesEl.appendChild(b);
      });
      KidsAudio.speak('This is a '+w+'. Which letter starts the word '+w+'?');
    }
    function pick(ch,btn){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(e){}
      if(ch===answer){
        locked=true; score++; scoreEl.textContent='⭐ '+score;
        const blank=wordEl.querySelector('.blank');
        blank.classList.remove('blank'); blank.classList.add('filled');
        KidsAudio.playChime('yay');
        KidsAudio.speak(ch+', '+word.slice(1)+', '+word+'! You built the word '+word+'!');
        confetti(); setTimeout(newRound,2400);
      } else {
        btn.classList.add('wrong'); KidsAudio.playChime('uhoh');
        KidsAudio.speak('Listen: '+word+'. Try another letter!');
        setTimeout(()=>btn.classList.remove('wrong'),400);
      }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
