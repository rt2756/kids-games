<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Odd One Out</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #1e2650 0%, #2e1a44 100%); }
  h1 { color:#fff; font-weight:900; font-size:clamp(18px,4.4vw,28px); margin:0 0 20px; text-align:center; padding:0 14px; text-shadow:1px 1px 0 rgba(0,0,0,.2); }
  #grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .card { border:none; border-radius:22px; background:rgba(255,255,255,.92); cursor:pointer;
    width:clamp(100px,26vw,150px); height:clamp(100px,26vw,150px); font-size:clamp(50px,14vw,80px); line-height:1;
    box-shadow:0 8px 0 rgba(0,0,0,.2); transition:transform .08s; font-family:inherit; }
  .card:active { transform:translateY(3px); }
  .card.wrong { animation:shake .35s; }
  .card.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #hint { color:#fff; font-weight:800; font-size:clamp(15px,4vw,20px); margin-top:16px; opacity:.9; min-height:26px; text-align:center; padding:0 14px; }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#fff; font-weight:900; font-size:18px; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1>Which one does not belong?</h1>
  <div id="grid"></div>
  <div id="hint"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const GROUPS=[
      { name:'fruits',      items:['🍎','🍌','🍇','🍓','🍊','🍉'] },
      { name:'animals',     items:['🐶','🐱','🐭','🐰','🐻','🦁'] },
      { name:'vehicles',    items:['🚗','🚌','🚲','✈️','🚂','🚜'] },
      { name:'clothes',     items:['👕','👗','🧦','🧢','🧤','👖'] },
      { name:'sea animals', items:['🐟','🐙','🦀','🐬','🦈','🐢'] },
      { name:'birds',       items:['🦆','🦉','🦜','🐦','🦅','🐧'] },
      { name:'instruments', items:['🎸','🥁','🎹','🎺','🎻','🪈'] },
      { name:'vegetables',  items:['🥕','🥒','🍆','🌽','🥔','🧅'] },
      { name:'sports balls',items:['⚽','🏀','🏈','🎾','🏐','🏏'] },
      { name:'insects',     items:['🐝','🐞','🦋','🐜','🦗','🪲'] },
    ];
    const grid=document.getElementById('grid'), hint=document.getElementById('hint'), scoreEl=document.getElementById('score');
    let answer, groupName, oddGroupName, score=0, locked=false;

    function newRound(){
      locked=false; grid.innerHTML=''; hint.textContent='';
      const main=KidsUtil.rand(GROUPS);
      let odd; do { odd=KidsUtil.rand(GROUPS); } while(odd===main);
      groupName=main.name; oddGroupName=odd.name;
      const three=KidsUtil.shuffle(main.items).slice(0,3);
      answer=KidsUtil.rand(odd.items);
      KidsUtil.shuffle([...three,answer]).forEach(e=>{
        const b=document.createElement('button'); b.className='card'; b.textContent=e;
        b.onclick=()=>pick(e,b); grid.appendChild(b);
      });
      KidsAudio.speak('Three of these go together. Tap the one that does not belong!');
    }
    function pick(e,btn){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(err){}
      if(e===answer){
        locked=true; score++; scoreEl.textContent='⭐ '+score;
        btn.classList.add('right');
        hint.textContent='The others are all '+groupName+'!';
        KidsAudio.playChime('yay');
        KidsAudio.speak('Yes! The others are all '+groupName+'!');
        confetti(); setTimeout(newRound,2400);
      } else {
        btn.classList.add('wrong'); KidsAudio.playChime('uhoh');
        KidsAudio.speak('That one has friends here. Try again!');
        setTimeout(()=>btn.classList.remove('wrong'),400);
      }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
