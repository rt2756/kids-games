<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Area &amp; Perimeter</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #1a2980 0%, #26d0ce 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #0c1440 0%, #0e4a4a 100%); }
  h1 { color:#fff; font-weight:900; font-size:clamp(18px,4.2vw,26px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; text-shadow:1px 1px 0 rgba(0,0,0,.2); }
  #dims { color:#fff; font-weight:900; font-size:clamp(17px,4.6vw,24px); margin-bottom:8px; }
  #rect { display:grid; gap:3px; background:rgba(255,255,255,.25); padding:6px; border-radius:12px; margin-bottom:16px; }
  .sq { width:clamp(24px,6vw,38px); height:clamp(24px,6vw,38px); background:#ffd54f; border-radius:4px; }
  #choices { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .choice { border:none; border-radius:16px; background:#fff; color:#1a2980; font-weight:900; cursor:pointer;
    font-size:clamp(20px,5.5vw,30px); padding:14px 24px;
    box-shadow:0 7px 0 rgba(0,0,0,.2); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; }
  .choice.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#fff; font-weight:900; font-size:18px; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1 id="q"></h1>
  <div id="dims"></div>
  <div id="rect"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    const qEl=document.getElementById('q'), dims=document.getElementById('dims'),
      rect=document.getElementById('rect'), choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let answer, score=0, locked=false;

    function newRound(){
      locked=false; rect.innerHTML=''; choicesEl.innerHTML='';
      const w=2+Math.floor(Math.random()*7); // 2..8
      const h=2+Math.floor(Math.random()*5); // 2..6
      const askArea=Math.random()<0.5;
      answer=askArea?w*h:2*(w+h);
      qEl.textContent=askArea?'What is the AREA of this rectangle?':'What is the PERIMETER of this rectangle?';
      dims.textContent=w+' units wide × '+h+' units tall';
      rect.style.gridTemplateColumns='repeat('+w+',1fr)';
      for(let i=0;i<w*h;i++){ const d=document.createElement('div'); d.className='sq'; rect.appendChild(d); }
      const other=askArea?2*(w+h):w*h;
      const opts=new Set([answer]);
      opts.add(other===answer?answer+2:other); // classic mix-up as a distractor
      while(opts.size<3) opts.add(answer+KidsUtil.rand([-4,-2,2,4,6]));
      KidsUtil.shuffle([...opts]).forEach(v=>{
        const b=document.createElement('button'); b.className='choice';
        b.textContent=v+(askArea?' sq units':' units');
        b.onclick=()=>pick(v,b,askArea,w,h); choicesEl.appendChild(b);
      });
      KidsAudio.speak(askArea
        ? 'The rectangle is '+w+' wide and '+h+' tall. What is its area?'
        : 'The rectangle is '+w+' wide and '+h+' tall. What is its perimeter — the distance all the way around?');
    }
    function pick(v,btn,askArea,w,h){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(e){}
      if(v===answer){
        locked=true; score++; scoreEl.textContent='⭐ '+score;
        btn.classList.add('right'); KidsAudio.playChime('yay');
        KidsAudio.speak(askArea
          ? 'Yes! '+w+' times '+h+' is '+answer+' square units!'
          : 'Yes! '+w+' plus '+h+' plus '+w+' plus '+h+' is '+answer+' units all the way around!');
        confetti(); setTimeout(newRound,2500);
      } else {
        btn.classList.add('wrong'); KidsAudio.playChime('uhoh');
        KidsAudio.speak(askArea?'Area is width times height. Try again!':'Perimeter is all four sides added up. Try again!');
        setTimeout(()=>btn.classList.remove('wrong'),400);
      }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
