<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Roman Numerals</title>
<link rel="stylesheet" href="../../shared/styles.css" />
<style>
  body { background: linear-gradient(180deg, #c79081 0%, #dfa579 100%);
    height:100vh; width:100vw; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  html[data-theme="dark"] body { background: linear-gradient(180deg, #3a2620 0%, #3e2c1a 100%); }
  h1 { color:#4e2a14; font-weight:900; font-size:clamp(18px,4.2vw,26px); margin:0; position:fixed; top:96px; left:0; right:0; text-align:center; }
  html[data-theme="dark"] h1 { color:#ffe0c4; }
  #pillar { font-size:clamp(40px,10vw,60px); line-height:1; margin-bottom:4px; }
  #num { color:#4e2a14; font-weight:900; font-size:clamp(56px,15vw,96px); line-height:1.1; letter-spacing:4px; }
  html[data-theme="dark"] #num { color:#fff; }
  #choices { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:20px 12px; }
  .choice { border:none; border-radius:16px; background:#fff; color:#8d4a1f; font-weight:900; cursor:pointer;
    font-size:clamp(22px,6vw,32px); padding:14px 26px; letter-spacing:2px;
    box-shadow:0 7px 0 rgba(0,0,0,.2); transition:transform .08s; font-family:inherit; }
  .choice:active { transform:translateY(3px); }
  .choice.wrong { animation:shake .35s; }
  .choice.right { background:#b6f09c; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #score { position:fixed; top:20px; left:50%; transform:translateX(-50%); color:#4e2a14; font-weight:900; font-size:18px; }
  html[data-theme="dark"] #score { color:#ffe0c4; }
  .confetti { position:fixed; font-size:26px; pointer-events:none; z-index:500; animation:fall 1.6s ease-in forwards; }
  @keyframes fall { from{transform:translateY(-30px);opacity:1} to{transform:translateY(105vh) rotate(360deg);opacity:.8} }
</style>
</head>
<body>
  <div id="score">⭐ 0</div>
  <h1 id="q"></h1>
  <div id="pillar">🏛️</div>
  <div id="num"></div>
  <div id="choices"></div>

  <script src="../../shared/common.js"></script>
  <script>
    function toRoman(n){
      const map=[[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
      let out='';
      for(const [v,s] of map){ while(n>=v){ out+=s; n-=v; } }
      return out;
    }
    const qEl=document.getElementById('q'), numEl=document.getElementById('num'),
      choicesEl=document.getElementById('choices'), scoreEl=document.getElementById('score');
    let answer, score=0, locked=false;

    function newRound(){
      locked=false; choicesEl.innerHTML='';
      const n=1+Math.floor(Math.random()*50);
      const toRomanMode=Math.random()<0.5;
      const opts=new Set([n]);
      while(opts.size<3){ const d=Math.max(1,Math.min(50,n+Math.floor(Math.random()*9)-4)); opts.add(d); }
      if(toRomanMode){
        qEl.textContent='Which Roman numeral is this number?';
        numEl.textContent=n;
        answer=toRoman(n);
        KidsUtil.shuffle([...opts]).forEach(v=>{
          const b=document.createElement('button'); b.className='choice'; b.textContent=toRoman(v);
          b.onclick=()=>pick(toRoman(v)===answer,b,n); choicesEl.appendChild(b);
        });
        KidsAudio.speak('How do the Romans write '+n+'?');
      } else {
        qEl.textContent='What number is this Roman numeral?';
        numEl.textContent=toRoman(n);
        answer=n;
        KidsUtil.shuffle([...opts]).forEach(v=>{
          const b=document.createElement('button'); b.className='choice'; b.textContent=v;
          b.onclick=()=>pick(v===answer,b,n); choicesEl.appendChild(b);
        });
        KidsAudio.speak('What number is '+toRoman(n).split('').join(' ')+'?');
      }
    }
    function pick(correct,btn,n){
      if(locked) return;
      try{KidsAudio.getAudio();}catch(e){}
      if(correct){
        locked=true; score++; scoreEl.textContent='⭐ '+score;
        btn.classList.add('right'); KidsAudio.playChime('yay');
        KidsAudio.speak('Yes! '+toRoman(n).split('').join(' ')+' is '+n+'!');
        confetti(); setTimeout(newRound,2300);
      } else {
        btn.classList.add('wrong'); KidsAudio.playChime('uhoh');
        KidsAudio.speak('Remember: I is 1, V is 5, X is 10, L is 50. Try again!');
        setTimeout(()=>btn.classList.remove('wrong'),400);
      }
    }
    function confetti(){ for(let i=0;i<22;i++){ const c=document.createElement('div'); c.className='confetti';
      c.textContent=KidsUtil.rand(['🎉','⭐','✨','🌈']); c.style.left=Math.random()*100+'vw'; c.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(c); setTimeout(()=>c.remove(),2100); } }
    newRound();
  </script>
</body>
</html>
